      <div class="publication-scroll-rail__track" role="slider" tabindex="0" aria-label="Teaching timeline position" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="publication-scroll-rail__fill" aria-hidden="true"></span>

      </div>
      <div class="publication-scroll-rail__markers">
        <button class="publication-year-jump teaching-year-jump" type="button" data-teaching-year="2026" aria-controls="teaching-2026">
          <span class="teaching-book-marker" aria-hidden="true">

            <a class="publication-link teaching-link" href="https://www.gradescope.com/courses/1357498">

<script>
  (() => {
    const shell = document.querySelector('[data-teaching-shell]');
    if (!shell) return;

    const list = shell.querySelector('.teaching-list');
    const rail = shell.querySelector('.teaching-scroll-rail');
    const track = shell.querySelector('.publication-scroll-rail__track');
    const markers = [...shell.querySelectorAll('.teaching-year-jump')];
    const sections = markers.map(marker => document.getElementById(`teaching-${marker.dataset.teachingYear}`));
    const mobileQuery = window.matchMedia('(max-width: 700px)');
    let dragging = false;
    let frameRequested = false;

    const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
    const headerOffset = () => mobileQuery.matches ? 118 : 96;
    const listTop = () => list.getBoundingClientRect().top + window.scrollY;
    const scrollRange = () => {
      const available = document.documentElement.scrollHeight - window.innerHeight - (listTop() - headerOffset());
      return Math.max(1, Math.min(list.offsetHeight, Math.max(1, available)));
    };
    const currentProgress = () => clamp((window.scrollY - (listTop() - headerOffset())) / scrollRange());

    const setProgress = progress => {
      const value = clamp(progress);
      const markerStart = mobileQuery.matches ? 3.85 : 3.5;
      const markerEnd = mobileQuery.matches ? 96.15 : 96.5;
      shell.style.setProperty('--publication-scroll-progress', `${value * 100}%`);
      shell.style.setProperty('--publication-marker-position', `${markerStart + value * (markerEnd - markerStart)}%`);
      track.setAttribute('aria-valuenow', String(Math.round(value * 100)));
    };

    const update = () => {
      setProgress(currentProgress());
      frameRequested = false;
    };

    const requestUpdate = () => {
      if (frameRequested) return;
      frameRequested = true;
      window.requestAnimationFrame(update);
    };

    const positionMarkers = () => {
      track.setAttribute('aria-orientation', mobileQuery.matches ? 'horizontal' : 'vertical');
      const firstOffset = sections[0]?.offsetTop || 0;
      const range = Math.max(1, list.offsetHeight);
      sections.forEach((section, index) => {
        const relativeOffset = Math.max(0, (section?.offsetTop || firstOffset) - firstOffset);
        const position = clamp(relativeOffset / range, 0.035, 0.965);
        markers[index].style.setProperty('--publication-year-position', `${position * 100}%`);
      });
      rail.classList.add('is-ready');
      shell.classList.add('publication-rail-ready');
      requestUpdate();
    };

    const scrollToProgress = progress => {
      const value = clamp(progress);
      window.scrollTo({
        top: listTop() - headerOffset() + value * scrollRange(),
        behavior: 'auto'
      });
      setProgress(value);
    };

    const pointerProgress = event => {
      const rect = track.getBoundingClientRect();
      return mobileQuery.matches
        ? clamp((event.clientX - rect.left) / rect.width)
        : clamp((event.clientY - rect.top) / rect.height);
    };

    markers.forEach((marker, index) => {
      marker.addEventListener('click', () => {
        const section = sections[index];
        if (!section) return;
        window.scrollTo({
          top: section.getBoundingClientRect().top + window.scrollY - headerOffset(),
          behavior: 'auto'
        });
      });
    });

    track.addEventListener('pointerdown', event => {
      dragging = true;
      track.setPointerCapture?.(event.pointerId);
      scrollToProgress(pointerProgress(event));
      event.preventDefault();
    });
    track.addEventListener('pointermove', event => {
      if (dragging) scrollToProgress(pointerProgress(event));
    });
    const stopDragging = event => {
      if (!dragging) return;
      dragging = false;
      track.releasePointerCapture?.(event.pointerId);
    };
    track.addEventListener('pointerup', stopDragging);
    track.addEventListener('pointercancel', stopDragging);

    track.addEventListener('keydown', event => {
      const steps = {
        ArrowDown: 0.075, ArrowRight: 0.075,
        ArrowUp: -0.075, ArrowLeft: -0.075,
        PageDown: 0.2, PageUp: -0.2
      };
      if (event.key === 'Home' || event.key === 'End') {
        scrollToProgress(event.key === 'Home' ? 0 : 1);
        event.preventDefault();
      } else if (steps[event.key]) {
        scrollToProgress(currentProgress() + steps[event.key]);
        event.preventDefault();
      }
    });

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          const index = sections.indexOf(entry.target);
          const marker = markers[index];
          if (!marker) return;
          marker.classList.toggle('is-active', entry.isIntersecting);
          if (entry.isIntersecting) marker.setAttribute('aria-current', 'true');
          else marker.removeAttribute('aria-current');
        });
      }, { rootMargin: '-15% 0px -45% 0px', threshold: 0 });
      sections.forEach(section => section && observer.observe(section));
    } else {
      markers.forEach(marker => marker.classList.add('is-active'));
    }

    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', positionMarkers, { passive: true });
    mobileQuery.addEventListener?.('change', positionMarkers);
    if ('ResizeObserver' in window) new ResizeObserver(positionMarkers).observe(list);
    positionMarkers();
  })();
</script>
