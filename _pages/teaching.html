<div class="publication-pdf-reader teaching-logistics-viewer" id="teaching-logistics-viewer" data-logistics-viewer role="dialog" aria-modal="true" aria-labelledby="teaching-logistics-viewer-title" hidden>

        </button>

<script>
  (() => {
    const viewer = document.querySelector('[data-logistics-viewer]');
    const dialog = viewer?.querySelector('[data-logistics-viewer-dialog]');
    const frame = viewer?.querySelector('[data-logistics-viewer-frame]');
    const openButton = document.querySelector('[data-logistics-viewer-open]');
    const externalLink = viewer?.querySelector('[data-logistics-viewer-external]');
    const fullscreenButton = viewer?.querySelector('[data-logistics-viewer-fullscreen]');
    const fullscreenIcon = fullscreenButton?.querySelector('i');
    const fullscreenLabel = fullscreenButton?.querySelector('span');
    const closeButton = viewer?.querySelector('[data-logistics-viewer-close]');
    if (!viewer || !dialog || !frame || !openButton || !externalLink || !fullscreenButton || !closeButton) return;
    document.body.appendChild(viewer);

    const focusableElements = () => [...viewer.querySelectorAll('a[href], button:not([disabled])')]
      .filter(element => element.getClientRects().length > 0);

    const updateFullscreenControl = () => {
      const isFullscreen = document.fullscreenElement === dialog || viewer.classList.contains('is-reader-maximized');
      fullscreenButton.setAttribute('aria-label', isFullscreen ? 'Exit full screen' : 'Open full screen');
      if (fullscreenLabel) fullscreenLabel.textContent = isFullscreen ? 'Exit full screen' : 'Full screen';
      if (fullscreenIcon) {
        fullscreenIcon.classList.toggle('fa-expand', !isFullscreen);
        fullscreenIcon.classList.toggle('fa-compress', isFullscreen);
      }
    };

    const closeViewer = async () => {
      if (document.fullscreenElement === dialog && document.exitFullscreen) {
        await document.exitFullscreen().catch(() => {});
      }
      viewer.hidden = true;
      viewer.classList.remove('is-reader-maximized');
      document.body.classList.remove('publication-pdf-reader-open');
      frame.src = 'about:blank';
      openButton.focus();
      updateFullscreenControl();
    };

    openButton.addEventListener('click', () => {
      const pdfUrl = openButton.dataset.pdfUrl;
      if (!pdfUrl) return;
      frame.src = pdfUrl;
      externalLink.href = pdfUrl.split('#')[0];
      viewer.hidden = false;
      document.body.classList.add('publication-pdf-reader-open');
      closeButton.focus();
    });

    closeButton.addEventListener('click', closeViewer);
    fullscreenButton.addEventListener('click', async () => {
      if (document.fullscreenElement === dialog && document.exitFullscreen) {
        await document.exitFullscreen().catch(() => {});
      } else if (viewer.classList.contains('is-reader-maximized')) {
        viewer.classList.remove('is-reader-maximized');
      } else {
        viewer.classList.add('is-reader-maximized');
        if (dialog.requestFullscreen) await dialog.requestFullscreen().catch(() => {});
      }
      updateFullscreenControl();
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) viewer.classList.remove('is-reader-maximized');
      updateFullscreenControl();
    });
    viewer.addEventListener('pointerdown', event => {
      if (event.target === viewer) closeViewer();
    });
    viewer.addEventListener('keydown', event => {
      if (event.key === 'Escape' && viewer.classList.contains('is-reader-maximized') && !document.fullscreenElement) {
        event.preventDefault();
        viewer.classList.remove('is-reader-maximized');
        updateFullscreenControl();
        return;
      }
      if (event.key === 'Escape' && !document.fullscreenElement) {
        event.preventDefault();
        closeViewer();
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = focusableElements();
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    updateFullscreenControl();
  })();
</script>

<script>
  (() => {
    const shell = document.querySelector('[data-teaching-shell]');
    if (!shell) return;

    const list = shell.querySelector('.teaching-list');
    const rail = shell.querySelector('.teaching-scroll-rail');
    const track = shell.querySelector('.publication-scroll-rail__track');
    const markers = [...shell.querySelectorAll('.teaching-year-jump')];
    const sections = markers.map(marker => document.getElementById(`teaching-${marker.dataset.teachingYear}`));
    const mobileQuery = window.matchMedia('(max-width: 700px)');
    let dragging = false;
    let frameRequested = false;

    const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
    const headerOffset = () => mobileQuery.matches ? 118 : 96;
    const listTop = () => list.getBoundingClientRect().top + window.scrollY;
    const scrollRange = () => {
      const available = document.documentElement.scrollHeight - window.innerHeight - (listTop() - headerOffset());
      return Math.max(1, Math.min(list.offsetHeight, Math.max(1, available)));
    };
    const currentProgress = () => clamp((window.scrollY - (listTop() - headerOffset())) / scrollRange());

    const setProgress = progress => {
      const value = clamp(progress);
      const markerStart = mobileQuery.matches ? 3.85 : 3.5;
      const markerEnd = mobileQuery.matches ? 96.15 : 96.5;
      shell.style.setProperty('--publication-scroll-progress', `${value * 100}%`);
      shell.style.setProperty('--publication-marker-position', `${markerStart + value * (markerEnd - markerStart)}%`);
      track.setAttribute('aria-valuenow', String(Math.round(value * 100)));
    };

    const update = () => {
      setProgress(currentProgress());
      frameRequested = false;
    };

    const requestUpdate = () => {
      if (frameRequested) return;
      frameRequested = true;
      window.requestAnimationFrame(update);
    };

    const positionMarkers = () => {
      track.setAttribute('aria-orientation', mobileQuery.matches ? 'horizontal' : 'vertical');
      const firstOffset = sections[0]?.offsetTop || 0;
      const range = Math.max(1, list.offsetHeight);
      sections.forEach((section, index) => {
        const relativeOffset = Math.max(0, (section?.offsetTop || firstOffset) - firstOffset);
        const position = clamp(relativeOffset / range, 0.035, 0.965);
        markers[index].style.setProperty('--publication-year-position', `${position * 100}%`);
      });
      rail.classList.add('is-ready');
      shell.classList.add('publication-rail-ready');
      requestUpdate();
    };

    const scrollToProgress = progress => {
      const value = clamp(progress);
      window.scrollTo({
        top: listTop() - headerOffset() + value * scrollRange(),
        behavior: 'auto'
      });
      setProgress(value);
    };

    const pointerProgress = event => {
      const rect = track.getBoundingClientRect();
      return mobileQuery.matches
        ? clamp((event.clientX - rect.left) / rect.width)
        : clamp((event.clientY - rect.top) / rect.height);
    };

    markers.forEach((marker, index) => {
      marker.addEventListener('click', () => {
        const section = sections[index];
        if (!section) return;
        window.scrollTo({
          top: section.getBoundingClientRect().top + window.scrollY - headerOffset(),
          behavior: 'auto'
        });
      });
    });

    track.addEventListener('pointerdown', event => {
      dragging = true;
      track.setPointerCapture?.(event.pointerId);
      scrollToProgress(pointerProgress(event));
      event.preventDefault();
    });
    track.addEventListener('pointermove', event => {
      if (dragging) scrollToProgress(pointerProgress(event));
    });
    const stopDragging = event => {
      if (!dragging) return;
      dragging = false;
      track.releasePointerCapture?.(event.pointerId);
    };
    track.addEventListener('pointerup', stopDragging);
    track.addEventListener('pointercancel', stopDragging);

    track.addEventListener('keydown', event => {
      const steps = {
        ArrowDown: 0.075, ArrowRight: 0.075,
        ArrowUp: -0.075, ArrowLeft: -0.075,
        PageDown: 0.2, PageUp: -0.2
      };
      if (event.key === 'Home' || event.key === 'End') {
        scrollToProgress(event.key === 'Home' ? 0 : 1);
        event.preventDefault();
      } else if (steps[event.key]) {
        scrollToProgress(currentProgress() + steps[event.key]);
        event.preventDefault();
      }
    });

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          const index = sections.indexOf(entry.target);
          const marker = markers[index];
          if (!marker) return;
          marker.classList.toggle('is-active', entry.isIntersecting);
          if (entry.isIntersecting) marker.setAttribute('aria-current', 'true');
          else marker.removeAttribute('aria-current');
        });
      }, { rootMargin: '-15% 0px -45% 0px', threshold: 0 });
      sections.forEach(section => section && observer.observe(section));
    } else {
      markers.forEach(marker => marker.classList.add('is-active'));
    }

    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', positionMarkers, { passive: true });
    mobileQuery.addEventListener?.('change', positionMarkers);
    if ('ResizeObserver' in window) new ResizeObserver(positionMarkers).observe(list);
    positionMarkers();
  })();
</script>
