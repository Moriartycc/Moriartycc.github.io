<link rel="stylesheet" href="https://www.htmlcommentbox.com/static/commentbox.css">
<script>
  (() => {
    const posts = Array.from(document.querySelectorAll("[data-thoughts-post]"));
    if (!posts.length) return;

    let activePost = null;
    let loadToken = 0;

    const commentLabels = {
      comments_header: "Comments",
      name_label: "Name",
      content_label: "Share your thoughts",
      submit: "Post comment",
      no_comments_msg: "No comments yet. Be the first to share a thought.",
      add: "Add your comment",
      again: "Post another comment",
      reply: "Reply",
      said: "wrote:",
      anonymous: "Anonymous",
      MAX_CHARS: 4096,
      RELATIVE_DATES: true
    };

    const removeLiveCommentBox = () => {
      loadToken += 1;
      document.querySelectorAll("script[data-thoughts-comments-script]").forEach((script) => script.remove());
      document.querySelectorAll("#HCB_comment_box").forEach((box) => box.remove());
      try {
        delete window.HCB;
      } catch (error) {
        window.HCB = undefined;
      }
    };

    const clearComments = (post) => {
      const comments = post.querySelector("[data-thoughts-comments]");
      comments.hidden = true;
      comments.replaceChildren();
    };

    const collapsePost = (post) => {
      post.classList.remove("is-expanded");
      const toggle = post.querySelector("[data-thoughts-post-toggle]");
      toggle.setAttribute("aria-expanded", "false");
      toggle.textContent = "Show more...";

      if (activePost === post) {
        removeLiveCommentBox();
        activePost = null;
      }
      clearComments(post);
    };

    const loadComments = (post) => {
      removeLiveCommentBox();
      activePost = post;

      const comments = post.querySelector("[data-thoughts-comments]");
      comments.hidden = false;

      const box = document.createElement("div");
      box.id = "HCB_comment_box";
      box.innerHTML = '<p class="thoughts-comments__loading">Loading comments&hellip;</p>';
      comments.appendChild(box);

      window.hcb_user = {
        ...commentLabels,
        PAGE: post.dataset.commentsPage
      };

      const token = loadToken;
      const script = document.createElement("script");
      const host = "https://www.htmlcommentbox.com";
      script.type = "text/javascript";
      script.async = true;
      script.dataset.thoughtsCommentsScript = "";
      script.src = `${host}/jread?page=${encodeURIComponent(window.hcb_user.PAGE).replace("+", "%2B")}&opts=16662&num=10&ts=${Date.now()}`;
      script.addEventListener("error", () => {
        if (token !== loadToken || activePost !== post) return;
        box.innerHTML = '<p class="thoughts-comments__loading">Comments could not be loaded. Please try again later.</p>';
      });
      document.head.appendChild(script);
    };

    const expandPost = (post) => {
      posts.forEach((otherPost) => {
        if (otherPost !== post) collapsePost(otherPost);
      });

      post.classList.add("is-expanded");
      const toggle = post.querySelector("[data-thoughts-post-toggle]");
      toggle.setAttribute("aria-expanded", "true");
      toggle.textContent = "Show less";
      loadComments(post);

      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", `#${post.id}`);
      }
    };

    posts.forEach((post) => {
      post.classList.add("is-collapsible");
      const toggle = post.querySelector("[data-thoughts-post-toggle]");
      toggle.hidden = false;
      toggle.addEventListener("click", () => {
        if (post.classList.contains("is-expanded")) {
          collapsePost(post);
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
          }
        } else {
          expandPost(post);
        }
      });
    });

    const requestedPost = posts.find((post) => window.location.hash === `#${post.id}`);
    if (requestedPost) expandPost(requestedPost);
  })();
</script>
