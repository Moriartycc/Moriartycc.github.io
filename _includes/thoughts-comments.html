<section class="thoughts-comments" aria-label="Comments">
  <div id="HCB_comment_box">
    <p class="thoughts-comments__loading">Loading comments&hellip;</p>
  </div>
  <noscript>
    <p>Please enable JavaScript to read or leave comments.</p>
  </noscript>
</section>

<link rel="stylesheet" href="https://www.htmlcommentbox.com/static/commentbox.css">
<script>
  window.hcb_user = {
    PAGE: "https://moriartycc.github.io/thoughts-on-ai/",
    comments_header: "Comments",
    name_label: "Name",
    content_label: "Share your thoughts",
    submit: "Post comment",
    no_comments_msg: "No comments yet. Be the first to share a thought.",
    add: "Add your comment",
    again: "Post another comment",
    said: "wrote:",
    anonymous: "Anonymous",
    MAX_CHARS: 4096,
    RELATIVE_DATES: true
  };

  (() => {
    const script = document.createElement("script");
    const page = window.hcb_user.PAGE || String(window.location).replace(/'/g, "%27");
    const host = "https://www.htmlcommentbox.com";
    script.type = "text/javascript";
    script.async = true;
    script.src = `${host}/jread?page=${encodeURIComponent(page).replace("+", "%2B")}&opts=278&num=10&ts=${Date.now()}`;
    document.head.appendChild(script);
  })();
</script>
