<div class="publication-pdf-reader" id="publication-pdf-reader" data-pdf-reader role="dialog" aria-modal="true" aria-labelledby="publication-pdf-reader-title" hidden>
  <div class="publication-pdf-reader__dialog" data-pdf-reader-dialog>
    <header class="publication-pdf-reader__toolbar">
      <div class="publication-pdf-reader__heading">
        <span class="publication-pdf-reader__eyebrow">Full-Text</span>
        <h2 id="publication-pdf-reader-title">Paper</h2>
      </div>
      <div class="publication-pdf-reader__controls">
        <a class="publication-pdf-reader__control" data-pdf-reader-external href="#" target="_blank" rel="noopener">
          <i class="fas fa-fw fa-external-link-alt" aria-hidden="true"></i>
          <span>Open PDF</span>
        </a>
        <button class="publication-pdf-reader__control" type="button" data-pdf-reader-fullscreen>
          <i class="fas fa-fw fa-expand" aria-hidden="true"></i>
          <span>Full screen</span>
        </button>
        <button class="publication-pdf-reader__control publication-pdf-reader__control--close" type="button" data-pdf-reader-close>
          <i class="fas fa-fw fa-times" aria-hidden="true"></i>
          <span>Close</span>
        </button>
      </div>
    </header>
    <div class="publication-pdf-reader__viewport" data-pdf-reader-viewport>
      <div class="publication-pdf-reader__loading" data-pdf-reader-loading role="status">
        <span class="publication-pdf-reader__spinner" aria-hidden="true"></span>
        <span>Loading document&hellip;</span>
      </div>
      <div class="publication-pdf-reader__error" data-pdf-reader-error role="alert" hidden>
        <i class="fas fa-fw fa-exclamation-triangle" aria-hidden="true"></i>
        <strong>This PDF could not be displayed here.</strong>
        <span>You can still use Open PDF above.</span>
      </div>
      <div class="publication-pdf-reader__page-stage">
        <div class="publication-pdf-reader__pages" data-pdf-reader-pages></div>
      </div>
      <nav class="publication-pdf-reader__page-controls" aria-label="PDF page and zoom controls" data-pdf-reader-page-controls hidden>
        <button type="button" data-pdf-reader-previous aria-label="Previous page" title="Previous page">
          <i class="fas fa-fw fa-chevron-left" aria-hidden="true"></i>
        </button>
        <span data-pdf-reader-page-status aria-live="polite">Page 1 / 1</span>
        <button type="button" data-pdf-reader-next aria-label="Next page" title="Next page">
          <i class="fas fa-fw fa-chevron-right" aria-hidden="true"></i>
        </button>
        <span class="publication-pdf-reader__page-divider" aria-hidden="true"></span>
        <button type="button" data-pdf-reader-zoom-out aria-label="Zoom out" title="Zoom out">
          <i class="fas fa-fw fa-minus" aria-hidden="true"></i>
        </button>
        <span data-pdf-reader-zoom-status aria-live="polite">100%</span>
        <button type="button" data-pdf-reader-zoom-in aria-label="Zoom in" title="Zoom in">
          <i class="fas fa-fw fa-plus" aria-hidden="true"></i>
        </button>
      </nav>
    </div>
  </div>
</div>

<script>
  (() => {
    const reader = document.querySelector('[data-pdf-reader]');
    const dialog = reader?.querySelector('[data-pdf-reader-dialog]');
    const viewport = reader?.querySelector('[data-pdf-reader-viewport]');
    const pagesContainer = reader?.querySelector('[data-pdf-reader-pages]');
    const title = reader?.querySelector('#publication-pdf-reader-title');
    const eyebrow = reader?.querySelector('.publication-pdf-reader__eyebrow');
    const loading = reader?.querySelector('[data-pdf-reader-loading]');
    const errorMessage = reader?.querySelector('[data-pdf-reader-error]');
    const pageControls = reader?.querySelector('[data-pdf-reader-page-controls]');
    const previousButton = reader?.querySelector('[data-pdf-reader-previous]');
    const nextButton = reader?.querySelector('[data-pdf-reader-next]');
    const pageStatus = reader?.querySelector('[data-pdf-reader-page-status]');
    const zoomOutButton = reader?.querySelector('[data-pdf-reader-zoom-out]');
    const zoomInButton = reader?.querySelector('[data-pdf-reader-zoom-in]');
    const zoomStatus = reader?.querySelector('[data-pdf-reader-zoom-status]');
    const externalLink = reader?.querySelector('[data-pdf-reader-external]');
    const fullscreenButton = reader?.querySelector('[data-pdf-reader-fullscreen]');
    const fullscreenIcon = fullscreenButton?.querySelector('i');
    const fullscreenLabel = fullscreenButton?.querySelector('span');
    const closeButton = reader?.querySelector('[data-pdf-reader-close]');
    const openButtons = [...document.querySelectorAll('[data-pdf-reader-open]')];
    if (!reader || !dialog || !viewport || !pagesContainer || !title || !eyebrow || !loading || !errorMessage || !pageControls || !previousButton || !nextButton || !pageStatus || !zoomOutButton || !zoomInButton || !zoomStatus || !externalLink || !fullscreenButton || !closeButton || !openButtons.length) return;
    document.body.appendChild(reader);

    let returnFocus = null;
    let readerLabel = 'Full-Text';
    let pdfDocument = null;
    let pdfLoadingTask = null;
    let pageElements = [];
    let pageMetrics = [];
    const renderTasks = new Map();
    const renderRequests = new Map();
    let currentPage = 1;
    let zoomLevel = 1;
    let documentSequence = 0;
    let renderGeneration = 0;
    let resizeTimer = null;
    let scrollFrame = null;
    const pdfJsVersion = '4.10.38';
    const pdfJsBase = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${pdfJsVersion}`;
    let pdfJsPromise = null;
    const loadPdfJs = () => {
      if (!pdfJsPromise) {
        pdfJsPromise = import(`${pdfJsBase}/build/pdf.min.mjs`).then(pdfjsLib => {
          pdfjsLib.GlobalWorkerOptions.workerSrc = `${pdfJsBase}/build/pdf.worker.min.mjs`;
          return pdfjsLib;
        });
      }
      return pdfJsPromise;
    };

    const focusableElements = () => [...reader.querySelectorAll('a[href], button:not([disabled])')]
      .filter(element => element.getClientRects().length > 0);

    const updatePageControls = () => {
      const pageCount = pdfDocument?.numPages || 1;
      previousButton.disabled = !pdfDocument || currentPage <= 1;
      nextButton.disabled = !pdfDocument || currentPage >= pageCount;
      zoomOutButton.disabled = zoomLevel <= 0.75;
      zoomInButton.disabled = zoomLevel >= 2;
      pageStatus.textContent = `Page ${currentPage} / ${pageCount}`;
      zoomStatus.textContent = `${Math.round(zoomLevel * 100)}%`;
    };

    const defaultPageMetrics = () => pageMetrics.find(Boolean) || { width: 612, height: 792 };

    const pageDisplaySize = metrics => {
      const availableWidth = Math.max(1, viewport.clientWidth - 32);
      const scale = (availableWidth / metrics.width) * zoomLevel;
      return {
        width: Math.floor(metrics.width * scale),
        height: Math.floor(metrics.height * scale),
        scale
      };
    };

    const setPageSize = (pageElement, metrics = defaultPageMetrics()) => {
      const size = pageDisplaySize(metrics);
      pageElement.style.width = `${size.width}px`;
      pageElement.style.height = `${size.height}px`;
      return size;
    };

    const addPagePlaceholder = (pageElement, pageNumber) => {
      pageElement.replaceChildren();
      pageElement.classList.remove('is-rendering');
      pageElement.removeAttribute('data-rendered-zoom');
      const label = document.createElement('span');
      label.className = 'publication-pdf-reader__page-placeholder';
      label.textContent = `Page ${pageNumber}`;
      pageElement.appendChild(label);
    };

    const cancelPageRender = pageNumber => {
      const task = renderTasks.get(pageNumber);
      task?.cancel();
      renderTasks.delete(pageNumber);
      renderRequests.delete(pageNumber);
    };

    const unloadDistantPages = centrePage => {
      pageElements.forEach((pageElement, index) => {
        const pageNumber = index + 1;
        if (Math.abs(pageNumber - centrePage) <= 4) return;
        if (!pageElement.dataset.renderedZoom && !renderRequests.has(pageNumber)) return;
        cancelPageRender(pageNumber);
        addPagePlaceholder(pageElement, pageNumber);
      });
    };

    const renderPage = async pageNumber => {
      const documentAtStart = pdfDocument;
      const pageElement = pageElements[pageNumber - 1];
      const generation = renderGeneration;
      const request = {};
      let task = null;
      if (!documentAtStart || !pageElement || pageElement.dataset.renderedZoom === String(zoomLevel) || renderRequests.has(pageNumber)) return;
      renderRequests.set(pageNumber, request);
      pageElement.classList.add('is-rendering');
      try {
        const page = await documentAtStart.getPage(pageNumber);
        if (generation !== renderGeneration || documentAtStart !== pdfDocument || renderRequests.get(pageNumber) !== request) return;
        const naturalViewport = page.getViewport({ scale: 1 });
        const metrics = { width: naturalViewport.width, height: naturalViewport.height };
        pageMetrics[pageNumber - 1] = metrics;
        const size = setPageSize(pageElement, metrics);
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
        const renderViewport = page.getViewport({ scale: size.scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(renderViewport.width * outputScale);
        canvas.height = Math.floor(renderViewport.height * outputScale);
        canvas.style.width = `${size.width}px`;
        canvas.style.height = `${size.height}px`;
        canvas.setAttribute('aria-label', `Page ${pageNumber} of ${documentAtStart.numPages}`);
        pageElement.replaceChildren(canvas);
        const context = canvas.getContext('2d', { alpha: false });
        task = page.render({
          canvasContext: context,
          transform: outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0],
          viewport: renderViewport
        });
        renderTasks.set(pageNumber, task);
        await task.promise;
        if (generation !== renderGeneration || documentAtStart !== pdfDocument || renderRequests.get(pageNumber) !== request) return;
        pageElement.dataset.renderedZoom = String(zoomLevel);
        pageElement.classList.remove('is-rendering');
        if (pageNumber === 1) {
          loading.hidden = true;
          pageControls.hidden = false;
        }
      } catch (error) {
        if (error?.name === 'RenderingCancelledException' || generation !== renderGeneration) return;
        pageElement.classList.remove('is-rendering');
        if (pageNumber === 1) {
          loading.hidden = true;
          errorMessage.hidden = false;
        } else {
          addPagePlaceholder(pageElement, pageNumber);
        }
      } finally {
        if (renderTasks.get(pageNumber) === task) renderTasks.delete(pageNumber);
        if (renderRequests.get(pageNumber) === request) renderRequests.delete(pageNumber);
      }
    };

    const renderPageWindow = centrePage => {
      if (!pdfDocument) return;
      const firstPage = Math.max(1, centrePage - 2);
      const lastPage = Math.min(pdfDocument.numPages, centrePage + 2);
      for (let pageNumber = firstPage; pageNumber <= lastPage; pageNumber += 1) renderPage(pageNumber);
      unloadDistantPages(centrePage);
    };

    const updateCurrentPageFromScroll = () => {
      if (!pdfDocument || !pageElements.length) return;
      const viewportTop = viewport.getBoundingClientRect().top + 18;
      let nearestPage = currentPage;
      let nearestDistance = Number.POSITIVE_INFINITY;
      pageElements.forEach((pageElement, index) => {
        const bounds = pageElement.getBoundingClientRect();
        const distance = bounds.bottom < viewportTop
          ? viewportTop - bounds.bottom
          : Math.abs(bounds.top - viewportTop);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestPage = index + 1;
        }
      });
      if (nearestPage !== currentPage) {
        currentPage = nearestPage;
        updatePageControls();
      }
      renderPageWindow(currentPage);
    };

    const requestScrollUpdate = () => {
      if (scrollFrame !== null) return;
      scrollFrame = window.requestAnimationFrame(() => {
        scrollFrame = null;
        updateCurrentPageFromScroll();
      });
    };

    const scrollToPage = (pageNumber, behavior = 'smooth') => {
      const pageElement = pageElements[pageNumber - 1];
      if (!pageElement) return;
      currentPage = pageNumber;
      updatePageControls();
      renderPageWindow(currentPage);
      pageElement.scrollIntoView({ block: 'start', inline: 'center', behavior });
    };

    const refreshPageLayout = () => {
      if (!pdfDocument) return;
      renderGeneration += 1;
      renderTasks.forEach(task => task.cancel());
      renderTasks.clear();
      renderRequests.clear();
      pageElements.forEach((pageElement, index) => {
        setPageSize(pageElement, pageMetrics[index] || defaultPageMetrics());
        addPagePlaceholder(pageElement, index + 1);
      });
      renderPageWindow(currentPage);
      window.requestAnimationFrame(() => scrollToPage(currentPage, 'auto'));
    };

    const clearDocument = async () => {
      documentSequence += 1;
      renderGeneration += 1;
      renderTasks.forEach(task => task.cancel());
      renderTasks.clear();
      renderRequests.clear();
      if (pdfLoadingTask) {
        await pdfLoadingTask.destroy().catch(() => {});
        pdfLoadingTask = null;
      }
      if (pdfDocument) {
        await pdfDocument.destroy().catch(() => {});
        pdfDocument = null;
      }
      if (scrollFrame !== null) window.cancelAnimationFrame(scrollFrame);
      scrollFrame = null;
      pagesContainer.replaceChildren();
      pageElements = [];
      pageMetrics = [];
      pageControls.hidden = true;
      errorMessage.hidden = true;
      currentPage = 1;
      zoomLevel = 1;
      updatePageControls();
    };

    const loadDocument = async pdfUrl => {
      await clearDocument();
      const sequence = ++documentSequence;
      loading.hidden = false;
      try {
        const pdfjsLib = await loadPdfJs();
        if (sequence !== documentSequence) return;
        pdfLoadingTask = pdfjsLib.getDocument({ url: pdfUrl });
        const loadedDocument = await pdfLoadingTask.promise;
        if (sequence !== documentSequence) {
          await loadedDocument.destroy().catch(() => {});
          return;
        }
        pdfDocument = loadedDocument;
        pdfLoadingTask = null;
        eyebrow.textContent = `${readerLabel} · ${pdfDocument.numPages} pages`;
        const firstPage = await pdfDocument.getPage(1);
        if (sequence !== documentSequence) return;
        const firstViewport = firstPage.getViewport({ scale: 1 });
        pageMetrics[0] = { width: firstViewport.width, height: firstViewport.height };
        const fragment = document.createDocumentFragment();
        pageElements = Array.from({ length: pdfDocument.numPages }, (_, index) => {
          const pageElement = document.createElement('section');
          const pageNumber = index + 1;
          pageElement.className = 'publication-pdf-reader__page';
          pageElement.dataset.pageNumber = String(pageNumber);
          pageElement.setAttribute('aria-label', `Page ${pageNumber}`);
          setPageSize(pageElement, pageMetrics[0]);
          addPagePlaceholder(pageElement, pageNumber);
          fragment.appendChild(pageElement);
          return pageElement;
        });
        pagesContainer.appendChild(fragment);
        viewport.scrollTo({ top: 0, left: 0, behavior: 'auto' });
        updatePageControls();
        renderPageWindow(1);
      } catch (error) {
        if (sequence !== documentSequence) return;
        pdfLoadingTask = null;
        loading.hidden = true;
        errorMessage.hidden = false;
      }
    };

    const updateFullscreenControl = () => {
      const isFullscreen = document.fullscreenElement === dialog || reader.classList.contains('is-reader-maximized');
      fullscreenButton.setAttribute('aria-label', isFullscreen ? 'Exit full screen' : 'Open full screen');
      if (fullscreenLabel) fullscreenLabel.textContent = isFullscreen ? 'Exit full screen' : 'Full screen';
      if (fullscreenIcon) {
        fullscreenIcon.classList.toggle('fa-expand', !isFullscreen);
        fullscreenIcon.classList.toggle('fa-compress', isFullscreen);
      }
    };

    const closeReader = async () => {
      if (document.fullscreenElement === dialog && document.exitFullscreen) {
        await document.exitFullscreen().catch(() => {});
      }
      reader.hidden = true;
      reader.classList.remove('is-reader-maximized');
      document.body.classList.remove('publication-pdf-reader-open');
      await clearDocument();
      readerLabel = 'Full-Text';
      eyebrow.textContent = 'Full-Text';
      loading.hidden = false;
      returnFocus?.focus();
      returnFocus = null;
    };

    const openReader = button => {
      const pdfUrl = button.dataset.pdfUrl;
      const paperTitle = button.dataset.paperTitle || 'Paper';
      if (!pdfUrl) return;
      returnFocus = button;
      readerLabel = button.dataset.readerLabel || 'Full-Text';
      button.closest('[data-abstract-card]')?.classList.add('is-abstract-pinned');
      title.textContent = paperTitle;
      eyebrow.textContent = readerLabel;
      externalLink.href = pdfUrl;
      loading.hidden = false;
      reader.hidden = false;
      document.body.classList.add('publication-pdf-reader-open');
      closeButton.focus();
      loadDocument(pdfUrl);
    };

    openButtons.forEach(button => button.addEventListener('click', () => openReader(button)));
    closeButton.addEventListener('click', closeReader);
    previousButton.addEventListener('click', () => {
      if (!pdfDocument || currentPage <= 1) return;
      scrollToPage(currentPage - 1, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');
    });
    nextButton.addEventListener('click', () => {
      if (!pdfDocument || currentPage >= pdfDocument.numPages) return;
      scrollToPage(currentPage + 1, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');
    });
    zoomOutButton.addEventListener('click', () => {
      zoomLevel = Math.max(0.75, zoomLevel - 0.25);
      updatePageControls();
      refreshPageLayout();
    });
    zoomInButton.addEventListener('click', () => {
      zoomLevel = Math.min(2, zoomLevel + 0.25);
      updatePageControls();
      refreshPageLayout();
    });

    fullscreenButton.addEventListener('click', async () => {
      if (document.fullscreenElement === dialog && document.exitFullscreen) {
        await document.exitFullscreen().catch(() => {});
      } else if (reader.classList.contains('is-reader-maximized')) {
        reader.classList.remove('is-reader-maximized');
        updateFullscreenControl();
        window.setTimeout(refreshPageLayout, 120);
      } else {
        reader.classList.add('is-reader-maximized');
        updateFullscreenControl();
        if (dialog.requestFullscreen) await dialog.requestFullscreen().catch(() => {});
        window.setTimeout(refreshPageLayout, 120);
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) reader.classList.remove('is-reader-maximized');
      updateFullscreenControl();
      window.setTimeout(refreshPageLayout, 120);
    });
    window.addEventListener('resize', () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(refreshPageLayout, 180);
    }, { passive: true });
    viewport.addEventListener('scroll', requestScrollUpdate, { passive: true });
    reader.addEventListener('pointerdown', event => {
      if (event.target === reader) closeReader();
    });
    reader.addEventListener('keydown', event => {
      if (event.key === 'Escape' && reader.classList.contains('is-reader-maximized') && !document.fullscreenElement) {
        event.preventDefault();
        reader.classList.remove('is-reader-maximized');
        updateFullscreenControl();
        window.setTimeout(refreshPageLayout, 120);
        return;
      }
      if (event.key === 'Escape' && !document.fullscreenElement) {
        event.preventDefault();
        closeReader();
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = focusableElements();
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    updateFullscreenControl();
  })();
</script>
