<!-- Interactive research-theme map, derived from the approved homepage preview. -->
<style>
    #research-keyword-previews {
      --background: var(--global-bg-color, #fff);
      --foreground: var(--global-text-color, #343434);
      --muted-foreground: var(--global-text-color-light, #6f777d);
      --border: var(--global-border-color, #e5e7eb);
      --popover: var(--global-bg-color, #fff);
      --popover-foreground: var(--global-text-color, #343434);
      --viz-series-1: #339cff;
      --viz-series-2: #f3883b;
      --viz-series-3: #5dc977;
      --viz-series-4: #eb77b1;
      --viz-series-5: #9b79ec;
      --viz-series-6: #3ab9b1;
      color: var(--foreground);
      width: 100%;
      margin-top: 1rem;
    }
    html[data-theme="dark"] #research-keyword-previews {
      --viz-series-1: #83c3ff;
      --viz-series-2: #f59a56;
      --viz-series-3: #74d58b;
      --viz-series-4: #f08fc0;
      --viz-series-5: #aa91ef;
      --viz-series-6: #5acbc2;
    }
    #research-keyword-previews .preview-section { margin: 0 0 36px; }
    #research-keyword-previews .map-host { width: 100%; min-height: 560px; }
    #research-keyword-previews .map-controls { margin-bottom: 8px; }
    #research-keyword-previews .map-controls .form-label { min-width: min(100%, 320px); }
    #research-keyword-previews .map-controls .form-select { width: min(100%, 360px); color: var(--foreground); background: linear-gradient(145deg, var(--glass-specular, rgba(255,255,255,.2)), transparent 42%), var(--glass-card-fill, var(--background)); border: 1px solid var(--glass-edge, var(--border)); border-radius: 10px; box-shadow: inset 0 1px 0 var(--glass-specular, rgba(255,255,255,.16)), 0 8px 20px color-mix(in srgb, var(--foreground) 7%, transparent); color-scheme: light dark; }
    html[data-theme="dark"] #research-keyword-previews .map-controls .form-select,
    html[data-theme="dark"] #research-keyword-previews .map-controls .form-select option { color: #e6edf7; background-color: #14233a; border-color: #385475; }
    #research-keyword-previews .selected-line { color: var(--muted-foreground); min-height: 28px; margin-top: 6px; }
    #research-keyword-previews .selected-line strong { color: var(--foreground); font-weight: 500; }
    #research-keyword-previews .paper-link, #research-keyword-previews .tooltip a { white-space: nowrap; font-size: 11px; }
    #research-keyword-previews .legend { position: absolute; top: 10px; right: 10px; z-index: 12; display: grid; grid-template-columns: repeat(2, max-content); gap: 5px 7px; max-width: calc(100% - 20px); margin: 0; color: var(--muted-foreground); pointer-events: none; }
    #research-keyword-previews .legend-item { display: inline-flex; align-items: center; gap: 5px; min-width: 0; padding: 2px 7px; background: color-mix(in srgb, var(--glass-card-fill, var(--background)) 78%, transparent); border: 1px solid color-mix(in srgb, var(--glass-edge, var(--border)) 76%, transparent); border-radius: 999px; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--glass-specular, white) 56%, transparent), 0 5px 14px color-mix(in srgb, var(--constellation-sky, var(--background)) 34%, transparent); font-size: 10px; line-height: 1.25; white-space: nowrap; opacity: .68; -webkit-backdrop-filter: blur(10px) saturate(130%); backdrop-filter: blur(10px) saturate(130%); transition: opacity .22s ease, border-color .22s ease, box-shadow .22s ease; }
    #research-keyword-previews .legend-item.is-leading { border-color: color-mix(in srgb, var(--swatch) 68%, var(--glass-edge, var(--border))); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--glass-specular, white) 66%, transparent), 0 6px 16px color-mix(in srgb, var(--swatch) 16%, transparent); }
    #research-keyword-previews .legend-label { overflow: hidden; text-overflow: ellipsis; }
    #research-keyword-previews .legend-label-short { display: none; }
    #research-keyword-previews .legend-weight { min-width: 2.6em; color: var(--foreground); font-size: .9em; font-variant-numeric: tabular-nums; text-align: right; }
    #research-keyword-previews .legend:not(.is-reading) .legend-weight { display: none; }
    #research-keyword-previews .legend-swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--swatch); }
    #research-keyword-previews .tooltip { display: none; position: absolute; top: 0; left: 0; z-index: 20; width: min(340px, calc(100% - 8px)); padding: 9px 11px; border: 1px solid var(--glass-edge, var(--border)); border-radius: 12px; background: linear-gradient(145deg, var(--glass-specular, rgba(255,255,255,.18)), transparent 32%), color-mix(in srgb, var(--glass-card-fill, var(--popover)) 92%, transparent); color: var(--popover-foreground); box-shadow: inset 0 1px 0 var(--glass-specular, rgba(255,255,255,.18)), 0 16px 36px color-mix(in srgb, var(--foreground) 15%, transparent); -webkit-backdrop-filter: blur(18px) saturate(145%); backdrop-filter: blur(18px) saturate(145%); cursor: pointer; pointer-events: none; opacity: 0; visibility: hidden; overflow-wrap: anywhere; will-change: transform; }
    #research-keyword-previews .tooltip::before { position: absolute; top: 0; right: 12px; left: 12px; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--viz-series-1) 70%, white), transparent); content: ""; opacity: .72; }
    #research-keyword-previews .tooltip.is-visible { display: block; pointer-events: auto; opacity: 1; visibility: visible; }
    #research-keyword-previews .tooltip.is-pinned { border-color: color-mix(in srgb, var(--viz-series-1) 70%, var(--border)); transition: transform .22s cubic-bezier(.2,.72,.25,1); }
    #research-keyword-previews .tooltip-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #research-keyword-previews .tooltip-pin-state { flex: 0 0 auto; color: var(--muted-foreground); font-size: 10px; font-weight: 500; letter-spacing: .025em; }
    #research-keyword-previews .tooltip.is-pinned .tooltip-pin-state { color: var(--viz-series-1); }
    #research-keyword-previews .tooltip-family { color: var(--muted-foreground); margin: 2px 0 6px; }
    #research-keyword-previews .tooltip-paper { margin-top: 6px; font-size: 12px; line-height: 1.35; }
    #research-keyword-previews .paper-title { font-family: "Source Serif 4", Georgia, Cambria, "Times New Roman", serif; font-size: 0.94em; font-weight: 500; letter-spacing: 0.005em; }
    #research-keyword-previews .tooltip-more-group { margin-top: 7px; }
    #research-keyword-previews .tooltip-more-toggle { display: flex; align-items: center; gap: 5px; width: 100%; padding: 3px 1px; color: var(--muted-foreground); background: transparent; border: 0; font: inherit; font-size: 11px; text-align: left; cursor: pointer; }
    #research-keyword-previews .tooltip-more-toggle:hover, #research-keyword-previews .tooltip-more-toggle:focus-visible { color: var(--foreground); outline: none; }
    #research-keyword-previews .tooltip-more-chevron { display: inline-block; color: var(--viz-series-1); font-size: 10px; transition: transform .18s ease; }
    #research-keyword-previews .tooltip-more-group.is-expanded .tooltip-more-chevron { transform: rotate(90deg); }
    #research-keyword-previews .tooltip-extra-papers { max-height: 0; padding-right: 3px; opacity: 0; visibility: hidden; overflow: hidden; transition: max-height .22s ease, opacity .16s ease; }
    #research-keyword-previews .tooltip-more-group.is-expanded .tooltip-extra-papers { max-height: var(--tooltip-extra-height, min(58vh, 460px)); opacity: 1; visibility: visible; overflow-y: auto; scrollbar-width: thin; }
    #research-keyword-previews .tooltip-extra-paper { padding-left: 14px; }
    #research-keyword-previews .map-shell { position: relative; contain: layout; isolation: isolate; overflow: visible; }
    #research-keyword-previews .network-motion { transform-box: fill-box; transform-origin: center; animation: research-network-drift 16s ease-in-out infinite alternate; }
    #research-keyword-previews.is-map-paused .network-motion { animation-play-state: paused; }
    #research-keyword-previews .star-dust { fill: var(--foreground); pointer-events: none; }
    #research-keyword-previews .keyword-cloud { pointer-events: none; }
    #research-keyword-previews .keyword-cloud-label { fill: var(--constellation-text, var(--foreground)); font-weight: 420; letter-spacing: .018em; paint-order: stroke; stroke: var(--constellation-sky, var(--background)); stroke-width: 2.6px; stroke-linejoin: round; opacity: .18; pointer-events: none; transition: opacity .22s ease, fill .22s ease; }
    #research-keyword-previews .family-polytope { stroke-width: 1.2px; stroke-linejoin: round; }
    #research-keyword-previews .node-hit-target { fill: transparent; cursor: pointer; touch-action: manipulation; }
    #research-keyword-previews .vos-node { cursor: pointer; stroke: var(--background); stroke-width: 1px; stroke-linejoin: round; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #research-keyword-previews .node-depth { pointer-events: none; opacity: .3; }
    #research-keyword-previews .node-highlight { fill: none; stroke: var(--background); stroke-width: 1.2px; stroke-linejoin: round; opacity: .42; pointer-events: none; }
    #research-keyword-previews .vos-label { fill: var(--foreground); font-size: var(--label-size, 12px); font-weight: 470; letter-spacing: .008em; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: fill .22s ease; }
    #research-keyword-previews .vos-label.is-hovered { font-size: calc(var(--label-size, 12px) * 1.16); font-weight: 560; stroke-width: 3.5px; }
    #research-keyword-previews .vos-link { stroke: var(--border); }
    #research-keyword-previews .vos-node-wrap.is-muted, #research-keyword-previews .vos-link.is-muted { opacity: 0.12; }
    #research-keyword-previews .vos-label.is-muted { opacity: 0.2; }
    #research-keyword-previews .vos-node-wrap.is-selected .vos-node { stroke: var(--foreground); stroke-width: 2px; }
    #research-keyword-previews .vos-node-wrap.is-pinned .vos-node { stroke: var(--viz-series-1); stroke-width: 2.8px; }
    #research-keyword-previews .vos-node-wrap.is-pinned .node-highlight { stroke: var(--viz-series-1); stroke-width: 1.5px; opacity: .78; }
    #research-keyword-previews svg { display: block; max-width: 100%; }
    @keyframes research-network-drift {
      0% { transform: translate(-2px, 1px) rotate(-0.2deg); }
      48% { transform: translate(2px, -2px) rotate(0.15deg); }
      100% { transform: translate(-1px, 2px) rotate(0.25deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #research-keyword-previews .network-motion { animation: none; }
    }
    @media (max-width: 520px) {
      #research-keyword-previews .preview-section { margin-bottom: 28px; }
      #research-keyword-previews .map-host { min-height: 500px; }
      #research-keyword-previews .vos-label.is-hovered { font-size: calc(var(--label-size, 11px) * 1.14); }
      #research-keyword-previews .legend { top: 8px; right: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); width: calc(100% - 16px); max-width: none; gap: 4px; }
      #research-keyword-previews .legend-item { gap: 4px; padding: 2px 5px; font-size: 8px; }
      #research-keyword-previews .legend-label-full { display: none; }
      #research-keyword-previews .legend-label-short { display: inline; }
      #research-keyword-previews .legend-weight { min-width: 2.35em; }
    }
  </style>
<div id="research-keyword-previews">
  <section class="preview-section" aria-label="Interactive research themes">
    <div class="viz-controls map-controls">
      <label class="form-label" for="vos-term-select">Highlight a research theme
        <select id="vos-term-select" class="form-select"></select>
      </label>
    </div>
    <div class="map-shell">
      <div id="vos-keyword-map" class="map-host" role="img" aria-label="Network map of fourteen major research themes across fourteen papers"></div>
      <div id="vos-legend" class="legend" role="list" aria-label="Research theme family blend"></div>
      <div id="vos-tooltip" class="tooltip" role="tooltip" tabindex="-1"></div>
    </div>
    <div id="vos-selection" class="selected-line" aria-live="polite"><strong>Loading research themes…</strong></div>
  </section>
  <script>
    (() => {
      const root = document.getElementById('research-keyword-previews');
      const initializeResearchThemeMap = () => {
      const css = name => {
        const probe = document.createElement('span');
        probe.style.cssText = `display:none;color:var(${name})`;
        root.appendChild(probe);
        const value = getComputedStyle(probe).color;
        probe.remove();
        return value;
      };
      const entropy = new Uint32Array(1);
      if (globalThis.crypto?.getRandomValues) crypto.getRandomValues(entropy);
      else entropy[0] = Math.floor(Math.random()*4294967296);
      const loadSeed = entropy[0] / 4294967296;
      root.dataset.systemSeed = entropy[0].toString(16).padStart(8,'0');
      const seededRandom = salt => d3.randomLcg((loadSeed + salt*.61803398875) % 1);

      const papers = [
        {id:'P1', year:2019, title:'Asymmetry Helps: Eigenvalue and Eigenvector Analyses of Asymmetrically Perturbed Low-Rank Matrices', url:'https://arxiv.org/abs/1811.12804', linkLabel:'arXiv'},
        {id:'P2', year:2020, title:'Tackling Small Eigen-gaps: Fine-Grained Eigenvector Estimation and Inference under Heteroscedastic Noise', url:'https://arxiv.org/abs/2001.04620', linkLabel:'arXiv'},
        {id:'P3', year:2020, title:'Fast Global Convergence of Natural Policy Gradient Methods with Entropy Regularization', url:'https://arxiv.org/abs/2007.06558', linkLabel:'arXiv'},
        {id:'P4', year:2021, title:'The High-dimensional Asymptotics of First Order Methods with Random Data', url:'https://arxiv.org/abs/2112.07572', linkLabel:'arXiv'},
        {id:'P5', year:2022, title:'Memorize to Generalize: On the Necessity of Interpolation in High Dimensional Linear Regression', url:'https://arxiv.org/abs/2202.09889', linkLabel:'arXiv'},
        {id:'P6', year:2022, title:'How Many Labelers Do You Have? A Closer Look at Gold-Standard Labels', url:'https://arxiv.org/abs/2206.12041', linkLabel:'arXiv'},
        {id:'P7', year:2023, title:'Dimension Free Ridge Regression', url:'https://arxiv.org/abs/2210.08571', linkLabel:'arXiv'},
        {id:'P8', year:2023, title:'Collaboratively Learning Linear Models with Structured Missing Data', url:'https://arxiv.org/abs/2307.11947', linkLabel:'arXiv'},
        {id:'P9', year:2024, title:'Two Fundamental Limits for Uncertainty Quantification in Predictive Inference', url:'https://proceedings.mlr.press/v247/areces24a.html', linkLabel:'PMLR'},
        {id:'P10',year:2024, title:'Geometry, Computation, and Optimality in Stochastic Optimization', url:'https://arxiv.org/abs/1909.10455', linkLabel:'arXiv'},
        {id:'P11',year:2025, title:'State Evolution Beyond First-order Methods I: Rigorous Predictions and Finite-sample Guarantees', url:'https://arxiv.org/abs/2507.19611', linkLabel:'arXiv'},
        {id:'P12',year:2025, title:'Some Robustness Properties of Label Cleaning', url:'https://arxiv.org/abs/2509.11379', linkLabel:'arXiv'},
        {id:'P13',year:2026, title:'Concentration Inequalities for Exchangeable Tensors and Matrix-valued Data', url:'https://arxiv.org/abs/2601.20152', linkLabel:'arXiv'},
        {id:'P14',year:2026, title:'Is Memorization Helpful or Harmful? Prior Information Sets the Threshold', url:'https://arxiv.org/abs/2602.09405', linkLabel:'arXiv'}
      ];

      const corpusScores = {{ site.data.research_theme_scores | jsonify }};
      const families = corpusScores.metadata.families;
      const themeConcepts = corpusScores.concepts.filter(concept=>concept.kind==='theme');
      const keywordConcepts = corpusScores.concepts.filter(concept=>concept.kind==='keyword');
      const themeFamily = Object.fromEntries(themeConcepts.map(concept=>[concept.label,concept.family]));
      const relevance = Object.fromEntries(papers.map(paper=>[paper.id,{}]));
      themeConcepts.forEach(concept=>{
        papers.forEach(paper=>{relevance[paper.id][concept.label]=concept.paper_scores[paper.id]||0;});
      });
      const keywordData = keywordConcepts.map(concept=>({
        label:concept.label,
        lines:concept.lines,
        prevalence:concept.prevalence,
        themes:concept.theme_similarities,
        familyWeights:concept.family_weights
      }));

      const familyColor = {};
      families.forEach((family, i) => familyColor[family] = `var(--viz-series-${i + 1})`);
      const colorChannels = value => {
        const channels=(String(value).match(/[\d.]+/g)||[]).slice(0,3).map(Number);
        if (channels.length<3) return [232,246,255];
        return Math.max(...channels)<=1.01?channels.map(channel=>channel*255):channels;
      };
      const familyRgb = {};
      families.forEach((family,i)=>familyRgb[family]=colorChannels(css(`--viz-series-${i+1}`)));
      const constellationTextRgb=colorChannels(css('--constellation-text'));
      const blendFamilyWeights = weights => {
        const entries=Object.entries(weights).filter(([family,weight])=>familyRgb[family]&&weight>0);
        if (!entries.length) return `rgb(${constellationTextRgb.map(Math.round).join(',')})`;
        const total=entries.reduce((sum,[,weight])=>sum+weight,0);
        const mixed=[0,1,2].map(channel=>entries.reduce((sum,[family,weight])=>sum+familyRgb[family][channel]*weight,0)/total);
        const lifted=mixed.map((channel,index)=>channel*.86+constellationTextRgb[index]*.14);
        return `rgb(${lifted.map(Math.round).join(',')})`;
      };

      const allNodes = themeConcepts.map(concept => {
        const values = papers.map(p => relevance[p.id][concept.label] || 0);
        const paperMatches = papers.map((p,i) => ({...p, score:values[i]}))
          .filter(p => p.score >= .12)
          .sort((a,b) => b.score-a.score || b.year-a.year || a.id.localeCompare(b.id));
        return {
          theme:concept.label,
          id:concept.label,
          labelLines:concept.lines,
          family:concept.family,
          familyWeights:concept.family_weights,
          prevalence:concept.prevalence,
          weight:d3.sum(values),
          paperIds:paperMatches.map(p=>p.id),
          paperMatches
        };
      });
      const rankedNodes = allNodes.slice().sort((a,b)=>b.weight-a.weight || a.id.localeCompare(b.id));
      const nodes = rankedNodes;

      const linkCandidates = [];
      for (let i=0; i<nodes.length; i++) {
        for (let j=i+1; j<nodes.length; j++) {
          let minSum = 0, maxSum = 0, shared = 0, countA = 0, countB = 0;
          papers.forEach(p => {
            const a = relevance[p.id][nodes[i].theme] || 0;
            const b = relevance[p.id][nodes[j].theme] || 0;
            minSum += Math.min(a,b);
            maxSum += Math.max(a,b);
            if (a >= .15) countA++;
            if (b >= .15) countB++;
            if (a >= .15 && b >= .15) shared++;
          });
          if (!shared || !maxSum) continue;
          const jaccard = minSum/maxSum;
          const overlap = shared/Math.max(1,Math.min(countA,countB));
          const weight = .72*jaccard + .28*overlap;
          linkCandidates.push({source:nodes[i].id,target:nodes[j].id,weight,shared});
        }
      }
      linkCandidates.sort((a,b) => b.weight-a.weight || b.shared-a.shared);
      const keptLinkKeys = new Set();
      const nodeDegree = new Map(nodes.map(node=>[node.id,0]));
      const addLink = link => {
        const key=`${link.source}|${link.target}`;
        if (keptLinkKeys.has(key)) return false;
        keptLinkKeys.add(key);
        nodeDegree.set(link.source,nodeDegree.get(link.source)+1);
        nodeDegree.set(link.target,nodeDegree.get(link.target)+1);
        return true;
      };
      linkCandidates.forEach(link => {
        if (keptLinkKeys.size>=34 || link.weight<.15) return;
        if (nodeDegree.get(link.source)<5 && nodeDegree.get(link.target)<5) addLink(link);
      });
      nodes.forEach(node => {
        while (nodeDegree.get(node.id)<2) {
          const next=linkCandidates.find(link => {
            const touches=link.source===node.id||link.target===node.id;
            const other=link.source===node.id?link.target:link.source;
            return touches&&!keptLinkKeys.has(`${link.source}|${link.target}`)&&nodeDegree.get(other)<7;
          });
          if (!next) break;
          addLink(next);
        }
      });
      const keptLinks = linkCandidates.filter(l=>keptLinkKeys.has(`${l.source}|${l.target}`));
      const connectedThemes = new Map(nodes.map(d=>[d.id,new Set([d.id])]));
      keptLinks.forEach(link=>{
        connectedThemes.get(link.source)?.add(link.target);
        connectedThemes.get(link.target)?.add(link.source);
      });
      nodes.forEach(node=>{
        node.blendColor=blendFamilyWeights(node.familyWeights);
      });
      keywordData.forEach(keyword=>{
        keyword.blendColor=blendFamilyWeights(keyword.familyWeights);
      });

      const select = document.getElementById('vos-term-select');
      select.innerHTML = '<option value="">Show all themes</option>' + nodes
        .slice().sort((a,b)=>a.id.localeCompare(b.id))
        .map(d=>`<option value="${d.id}">${d.id}</option>`).join('');

      const legend = document.getElementById('vos-legend');
      const shortFamilyLabel = {
        'Random matrices & spectral methods':'Spectral methods',
        'High dimensional statistics':'High-dimensional stats',
        'Linear regression & linear methods':'Linear methods',
        'Machine learning theory':'ML theory',
        'Information theory & optimality':'Info theory & optimality',
        'Probability & its applications':'Probability & applications'
      };
      legend.innerHTML = families.map((family,index) =>
        `<span class="legend-item" role="listitem" data-family-index="${index}" style="--swatch:${familyColor[family]}">`+
          `<span class="legend-swatch"></span><span class="legend-label legend-label-full">${family}</span>`+
          `<span class="legend-label legend-label-short">${shortFamilyLabel[family]}</span><span class="legend-weight"></span>`+
        `</span>`
      ).join('');
      const legendItems=d3.select(legend).selectAll('.legend-item').data(families);

      const tooltip = d3.select('#vos-tooltip');
      const selectionText = document.getElementById('vos-selection');
      let currentSelection = '';
      let activeHoverTheme = '';
      let tooltipHideTimer = null;
      let shapeAnimationFrame = 0;
      let tooltipMoveFrame = 0;
      let tooltipViewportFrame = 0;
      let pendingTooltipPoint = null;
      let animationVisibilityObserver = null;
      let animationVisibilityHandler = null;
      let lastRenderedWidth = 0;
      let resizeRenderTimer = null;
      let pinnedTooltipPosition = null;
      let pinnedTooltipAnchorPosition = null;
      let expandTooltipAfterPin = '';
      let expandedTooltipTheme = '';
      let pinTooltipTheme = null;
      let keywordCloudSelection = null;
      let keywordCloudWidth = 0;
      let mapNodeWrapSelection = null;
      let mapNodeSelection = null;
      let mapLabelSelection = null;
      let mapLinkSelection = null;
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches;

      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[char]);
      const paperLink = paper => `<a class="paper-link" href="${paper.url}" target="_blank" rel="noopener">${paper.linkLabel} ↗</a>`;
      const paperLine = paper => `<span class="paper-title">${escapeHtml(paper.title)} (${paper.year})</span> ${paperLink(paper)}`;

      const clampRange = (value,min,max) => max<min?min:Math.max(min,Math.min(value,max));

      function boundedTooltipPoint(left,top,targetHeight) {
        const tip=tooltip.node();
        const parent=tip.parentElement;
        const box=parent.getBoundingClientRect();
        const edge=12;
        const minLeft=Math.max(4,edge-box.left);
        const maxLeft=Math.min(parent.clientWidth-tip.offsetWidth-4,window.innerWidth-edge-box.left-tip.offsetWidth);
        const minTop=edge-box.top;
        const maxTop=window.innerHeight-edge-box.top-targetHeight;
        return {left:clampRange(left,minLeft,maxLeft),top:clampRange(top,minTop,maxTop)};
      }

      function placeTooltip(clientX,clientY) {
        const tip=tooltip.node();
        const box=tip.parentElement.getBoundingClientRect();
        const point=boundedTooltipPoint(clientX-box.left+12,clientY-box.top+12,tip.offsetHeight);
        tooltip.style('transform',`translate3d(${point.left}px,${point.top}px,0)`);
      }

      function positionTooltip(event,immediate=false) {
        if (currentSelection&&tooltip.classed('is-pinned')&&tooltip.attr('data-theme')===currentSelection) return;
        let clientX=event?.clientX;
        let clientY=event?.clientY;
        if (!Number.isFinite(clientX)||!Number.isFinite(clientY)) {
          const box=tooltip.node().parentElement.getBoundingClientRect();
          clientX=box.left+box.width/2;
          clientY=box.top+box.height/2;
        }
        if (immediate) {
          placeTooltip(clientX,clientY);
          return;
        }
        pendingTooltipPoint={clientX,clientY};
        if (tooltipMoveFrame) return;
        tooltipMoveFrame=requestAnimationFrame(()=>{
          tooltipMoveFrame=0;
          if (!pendingTooltipPoint) return;
          const point=pendingTooltipPoint;
          pendingTooltipPoint=null;
          placeTooltip(point.clientX,point.clientY);
        });
      }

      function tooltipPoint(transform) {
        const match=(transform||'').match(/translate3d\(([-\d.]+)px,\s*([-\d.]+)px/i);
        return match?{left:Number(match[1]),top:Number(match[2])}:null;
      }

      function fitPinnedTooltip(expanded=false,extraNode=null) {
        const tip=tooltip.node();
        const current=tooltipPoint(tooltip.style('transform'));
        const anchor=tooltipPoint(pinnedTooltipAnchorPosition)||current;
        if (!anchor) {
          const box=tip.parentElement.getBoundingClientRect();
          placeTooltip(box.left+box.width/2,box.top+box.height/2);
          pinnedTooltipPosition=tooltip.style('transform');
          return;
        }
        const edge=12;
        let targetHeight=tip.offsetHeight;
        if (expanded&&extraNode) {
          const baseHeight=Math.max(0,tip.offsetHeight-extraNode.offsetHeight);
          const viewportAllowance=Math.max(0,window.innerHeight-edge*2-baseHeight);
          const extraLimit=Math.min(extraNode.scrollHeight,460,viewportAllowance);
          extraNode.style.setProperty('--tooltip-extra-height',`${extraLimit}px`);
          targetHeight=baseHeight+extraLimit;
        } else if (extraNode) {
          targetHeight-=extraNode.offsetHeight;
        }
        const point=boundedTooltipPoint(anchor.left,anchor.top,targetHeight);
        tooltip.style('transform',`translate3d(${point.left}px,${point.top}px,0)`);
        pinnedTooltipPosition=tooltip.style('transform');
      }

      function keepTooltipInViewport() {
        tooltipViewportFrame=0;
        const tip=tooltip.node();
        if (!tooltip.classed('is-visible')) return;
        const parentBox=tip.parentElement.getBoundingClientRect();
        if (parentBox.bottom<=0||parentBox.top>=window.innerHeight) return;
        const group=tooltip.select('.tooltip-more-group');
        const extraNode=group.empty()?null:group.select('.tooltip-extra-papers').node();
        const expanded=!group.empty()&&group.classed('is-expanded');
        if (tooltip.classed('is-pinned')) {
          fitPinnedTooltip(expanded,extraNode);
          return;
        }
        const current=tooltipPoint(tooltip.style('transform'));
        if (!current) return;
        const point=boundedTooltipPoint(current.left,current.top,tip.offsetHeight);
        tooltip.style('transform',`translate3d(${point.left}px,${point.top}px,0)`);
      }

      function scheduleTooltipViewportFit() {
        if (tooltipViewportFrame) return;
        tooltipViewportFrame=requestAnimationFrame(keepTooltipInViewport);
      }

      function setTooltipDisclosure(group,toggle,expanded) {
        const extraNode=group.select('.tooltip-extra-papers').node();
        const theme=tooltip.attr('data-theme')||'';
        if (expanded) expandedTooltipTheme=theme;
        else if (expandedTooltipTheme===theme) expandedTooltipTheme='';
        group.classed('is-expanded',expanded);
        toggle.attr('aria-expanded',String(expanded));
        requestAnimationFrame(()=>fitPinnedTooltip(expanded,extraNode));
      }

      function showPaperTooltip(event,node,preservePinnedPosition=false) {
        clearTimeout(tooltipHideTimer);
        const firstThree=node.paperMatches.slice(0,3);
        const extra=node.paperMatches.slice(3);
        const remaining=extra.length;
        const pinned=currentSelection===node.id;
        tooltip.html(
          `<div class="tooltip-heading"><strong>${escapeHtml(node.id)}</strong><span class="tooltip-pin-state">${pinned?'Pinned':'Click to pin'}</span></div>`+
          `<div class="tooltip-family">${escapeHtml(node.family)}</div>`+
          firstThree.map(p=>`<div class="tooltip-paper">${paperLine(p)}</div>`).join('')+
          (remaining>0
            ? `<div class="tooltip-more-group"><button type="button" class="tooltip-more-toggle" aria-expanded="false"><span class="tooltip-more-chevron" aria-hidden="true">&#9656;</span><span>${remaining} more ${remaining===1?'paper':'papers'}</span></button><div class="tooltip-extra-papers">${extra.map(p=>`<div class="tooltip-paper tooltip-extra-paper">${paperLine(p)}</div>`).join('')}</div></div>`
            : '')
        ).classed('is-visible',true).classed('is-pinned',pinned).attr('tabindex','0').attr('data-theme',node.id);
        const group=tooltip.select('.tooltip-more-group');
        const toggle=tooltip.select('.tooltip-more-toggle');
        if (!group.empty()) {
          group
            .on('pointerenter.expand',event=>{
              if (event.pointerType==='touch'||event.pointerType==='pen') return;
              if (currentSelection!==node.id) {
                expandTooltipAfterPin=node.id;
                pinTooltipTheme?.(event,node);
                return;
              }
              setTooltipDisclosure(group,toggle,true);
            });
          toggle
            .on('click.expand',event=>{
              if (currentSelection!==node.id) {
                expandTooltipAfterPin=node.id;
                return;
              }
              event.preventDefault();
              event.stopPropagation();
              setTooltipDisclosure(group,toggle,!group.classed('is-expanded'));
            });
        }
        if (preservePinnedPosition&&pinnedTooltipPosition) {
          tooltip.style('transform',pinnedTooltipPosition);
        } else {
          positionTooltip(event,true);
        }
        if (pinned&&(expandTooltipAfterPin===node.id||expandedTooltipTheme===node.id)&&!group.empty()) {
          if (expandTooltipAfterPin===node.id) expandTooltipAfterPin='';
          setTooltipDisclosure(group,toggle,true);
        }
      }

      function updatePaperDetails(theme) {
        if (!theme) {
          selectionText.innerHTML=coarsePointer
            ? '<strong>All themes.</strong> Tap a node once to pin it and keep its papers open.'
            : '<strong>All themes.</strong> Hover to preview; click a node or its paper window to pin it.';
          return;
        }
        const node=nodes.find(d=>d.id===theme);
        const state=theme===currentSelection?'Pinned':'Preview';
        selectionText.innerHTML=`<strong>${state}: ${escapeHtml(theme)}.</strong> ${node.paperMatches.length} related ${node.paperMatches.length===1?'paper':'papers'}, ranked by corpus-derived full-text relevance.`;
      }

      function updateLegend(theme) {
        const activeNode=nodes.find(node=>node.id===theme);
        const weights=activeNode?.familyWeights||null;
        const maximum=weights?d3.max(families,family=>weights[family]||0):0;
        legend.classList.toggle('is-reading',Boolean(activeNode));
        legendItems
          .classed('is-leading',family=>Boolean(weights)&&Math.abs((weights[family]||0)-maximum)<1e-8)
          .style('opacity',family=>{
            if (!weights||!maximum) return .68;
            const relative=(weights[family]||0)/maximum;
            return .14+.86*Math.pow(relative,.72);
          })
          .attr('aria-label',family=>weights
            ? `${family}: ${Math.round((weights[family]||0)*100)} percent of ${theme}'s color blend`
            : family);
        legendItems.select('.legend-weight').text(family=>weights?`${Math.round((weights[family]||0)*100)}%`:``);
      }

      function applyHighlight(theme) {
        const connected = theme ? connectedThemes.get(theme) : null;
        mapNodeWrapSelection
          ?.classed('is-muted', d => theme && !connected?.has(d.id))
          .classed('is-selected', d=>d.id===theme)
          .classed('is-pinned', d=>d.id===currentSelection);
        mapNodeSelection?.attr('aria-pressed',d=>String(d.id===currentSelection));
        mapLabelSelection?.classed('is-muted', d => theme && !connected?.has(d.id));
        mapLinkSelection?.classed('is-muted', d => {
          if (!theme) return false;
          const s = typeof d.source === 'object' ? d.source.id : d.source;
          const t = typeof d.target === 'object' ? d.target.id : d.target;
          return s !== theme && t !== theme;
        });
        if (keywordCloudSelection) {
          keywordCloudSelection
            .style('opacity',d=>{
              if (!theme) return keywordCloudWidth<520 ? .035+.10*d.prevalence : .075+.17*d.prevalence;
              const score=d.themes[theme]||0;
              return .025+.87*Math.pow(score,.78);
            })
            .style('fill',d=>d.blendColor);
        }
        updateLegend(theme);
        updatePaperDetails(theme);
      }

      function showSelection(theme) {
        currentSelection = theme;
        select.value = theme;
        root.dataset.selectedTheme = theme;
        applyHighlight(theme);
      }

      function renderMap() {
        cancelAnimationFrame(shapeAnimationFrame);
        shapeAnimationFrame=0;
        cancelAnimationFrame(tooltipMoveFrame);
        tooltipMoveFrame=0;
        pendingTooltipPoint=null;
        animationVisibilityObserver?.disconnect();
        animationVisibilityObserver=null;
        if (animationVisibilityHandler) document.removeEventListener('visibilitychange',animationVisibilityHandler);
        animationVisibilityHandler=null;
        const host = document.getElementById('vos-keyword-map');
        host.innerHTML = '';
        keywordCloudSelection=null;
        mapNodeWrapSelection=null;
        mapNodeSelection=null;
        mapLabelSelection=null;
        mapLinkSelection=null;
        const width = Math.max(320, host.getBoundingClientRect().width || 736);
        keywordCloudWidth=width;
        lastRenderedWidth=Math.round(width);
        const height = width < 520 ? 500 : 560;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const random = seededRandom(width<520 ? 2.25 : 1.25);
        const systemRotation = (random()-.5)*Math.PI*.9;
        const svg = d3.select(host).append('svg')
          .attr('viewBox', `0 0 ${width} ${height}`)
          .attr('width', width).attr('height', height)
          .attr('aria-labelledby','vos-svg-title vos-svg-desc');
        svg.append('title').attr('id','vos-svg-title').text('Research theme co-occurrence map');
        svg.append('desc').attr('id','vos-svg-desc').text('Themes are closer and connected when their corpus-derived paper relevance overlaps. Label and node size represent prevalence across the full-text corpus. Colors blend six research families according to empirical relevance. A faint outer cloud shows secondary concepts and brightens by cosine similarity when a theme is selected.');
        const motionLayer = svg.append('g').attr('class','network-motion');
        const spaceLayer = motionLayer.append('g').attr('aria-hidden','true');
        const starData=Array.from({length:width<520?26:40},()=>({
          x:14+random()*Math.max(30,width-28),
          y:12+random()*Math.max(30,height-24),
          r:.4+random()*1.05,
          opacity:.14+random()*.32,
          phase:random()*Math.PI*2
        }));
        const stars=spaceLayer.selectAll('circle').data(starData).join('circle')
          .attr('class','star-dust').attr('cx',d=>d.x).attr('cy',d=>d.y)
          .attr('r',d=>d.r).attr('opacity',d=>d.opacity);

        const prevalenceExtent=d3.extent(corpusScores.concepts,d=>d.prevalence);
        const commonLabelFont=d3.scaleSqrt().domain(prevalenceExtent).range(width<520?[7.2,13.1]:[8.4,15.2]);
        const keywordFont=d=>commonLabelFont(d.prevalence);
        const cloudData=keywordData.map((d,i)=>({
          ...d,
          angle:i*2*Math.PI/keywordData.length+systemRotation+(random()-.5)*.08,
          speed:.026,
          angularWobble:.018+random()*.018,
          radialBand:.78+(i%3)*.075,
          floatPhase:random()*Math.PI*2
        }));
        const keywordLabels=motionLayer.append('g').attr('class','keyword-cloud').attr('aria-hidden','true')
          .selectAll('text').data(cloudData).join('text')
          .attr('class','keyword-cloud-label')
          .attr('text-anchor','middle')
          .style('font-size',d=>`${keywordFont(d)}px`)
          .style('fill',d=>d.blendColor);
        keywordLabels.each(function(d){
          const lines=d.lines?.length?d.lines:[d.label];
          const text=d3.select(this);
          lines.forEach((line,index)=>{
            text.append('tspan').attr('x',0)
              .attr('dy',index? '1.04em' : `${-(lines.length-1)*.50}em`)
              .text(line);
          });
          d.textWidth=d3.max(Array.from(this.querySelectorAll('tspan')),span=>span.getComputedTextLength())||50;
          d.textHeight=keywordFont(d)*Math.max(1,lines.length)*1.04;
        });
        const positionKeywordCloud=seconds=>{
          const cx=width/2,cy=height/2;
          keywordLabels.each(function(d){
            const angle=d.angle+seconds*d.speed+d.angularWobble*Math.sin(seconds*.11+d.floatPhase);
            const horizontalRoom=Math.max(42,width/2-(d.textWidth||50)/2-10);
            const rx=horizontalRoom*d.radialBand;
            const ry=(height/2-(width<520?17:22))*d.radialBand;
            const drift=3.5*Math.sin(seconds*.23+d.floatPhase);
            d.cloudX=Math.max((d.textWidth||50)/2+6,Math.min(width-(d.textWidth||50)/2-6,cx+Math.cos(angle)*(rx+drift)));
            d.cloudY=Math.max(d.textHeight/2+5,Math.min(height-d.textHeight/2-5,cy+Math.sin(angle)*(ry+drift*.7)));
          });
          keywordLabels.attr('transform',d=>`translate(${d.cloudX},${d.cloudY})`);
        };
        positionKeywordCloud(0);
        keywordCloudSelection=keywordLabels;
        applyHighlight(currentSelection||activeHoverTheme);

        const centers = {};
        families.forEach((f,i) => {
          const angle = -Math.PI/2 + systemRotation + i * 2*Math.PI/families.length;
          const radial=.23+random()*.07;
          centers[f] = [width/2 + Math.cos(angle)*width*radial, height/2 + Math.sin(angle)*height*(radial-.02)];
        });

        const simNodes = nodes.map(d => ({
          ...d,
          x:centers[d.family][0] + (random()-.5)*42,
          y:centers[d.family][1] + (random()-.5)*42
        }));
        const simLinks = keptLinks.map(d=>({...d}));
        const radius = d3.scaleSqrt().domain(d3.extent(simNodes,d=>d.weight)).range(width < 520 ? [6,15] : [7,19]);
        const mainThemeBonus=width<520?1.25:1.65;
        simNodes.forEach(d=>{d.labelFontSize=commonLabelFont(d.prevalence)+mainThemeBonus;});
        d3.forceSimulation(simNodes)
          .randomSource(random)
          .force('link',d3.forceLink(simLinks).id(d=>d.id).distance(d=>(width<520?68:92)-18*Math.min(1,d.weight)).strength(d=>.18+.12*d.weight))
          .force('charge',d3.forceManyBody().strength(width<520?-110:-175))
          .force('x',d3.forceX(d=>centers[d.family][0]).strength(.12))
          .force('y',d3.forceY(d=>centers[d.family][1]).strength(.12))
          .force('collide',d3.forceCollide(d=>radius(d.weight)+(width<520?16:24)))
          .stop().tick(width<520?220:260);
        simNodes.forEach(d => { d.x=Math.max(28,Math.min(width-28,d.x)); d.y=Math.max(28,Math.min(height-28,d.y)); });
        simNodes.forEach((d,i) => {
          d.originX=d.x;
          d.originY=d.y;
          d.polySides=4+Math.floor(random()*3);
          d.polyPhase=random()*Math.PI*2;
          d.orbitSpeed=.62+random()*.38;
          d.orbitAmpX=.82+random()*.46;
          d.orbitAmpY=.82+random()*.46;
          d.orbitSecondary=.32+random()*.26;
          d.polyFactors=Array.from({length:d.polySides},()=>.84+random()*.18);
          d.currentBaseX=d.originX;
          d.currentBaseY=d.originY;
          d.currentScale=1;
          d.targetBaseX=d.originX;
          d.targetBaseY=d.originY;
          d.targetScale=1;
        });

        const familyData=families.map((family,i)=>({family,index:i,phase:random()*Math.PI*2,members:simNodes.filter(d=>d.family===family)})).filter(d=>d.members.length);
        function familyPolygon(group,positions) {
          const points=group.members.map(d=>[positions.get(d.id).x,positions.get(d.id).y]);
          let polygon;
          if (points.length===1) {
            const [x,y]=points[0],phase=group.phase;
            polygon=Array.from({length:5},(_,i)=>[x+Math.cos(phase+i*2*Math.PI/5)*(42+(i%2)*7),y+Math.sin(phase+i*2*Math.PI/5)*(38+((i+1)%2)*6)]);
          } else if (points.length===2) {
            const [a,b]=points,dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy)||1,ux=dx/length,uy=dy/length,px=-uy,py=ux;
            polygon=[
              [a[0]-ux*25+px*30,a[1]-uy*25+py*30],
              [b[0]+ux*25+px*24,b[1]+uy*25+py*24],
              [b[0]+ux*31-px*29,b[1]+uy*31-py*29],
              [a[0]-ux*22-px*25,a[1]-uy*22-py*25]
            ];
          } else {
            const base=d3.polygonHull(points)||points;
            const center=d3.polygonCentroid(base);
            polygon=base.map((point,i)=>{
              const dx=point[0]-center[0],dy=point[1]-center[1],length=Math.hypot(dx,dy)||1,pad=24+(i%2)*5;
              return [point[0]+dx/length*pad,point[1]+dy/length*pad];
            });
          }
          return polygon.map(point=>`${Math.max(4,Math.min(width-4,point[0]))},${Math.max(4,Math.min(height-4,point[1]))}`).join(' ');
        }
        const displayedPositions=new Map(simNodes.map(d=>[d.id,{x:d.x,y:d.y}]));
        const hull=motionLayer.append('g').attr('aria-hidden','true').selectAll('polygon').data(familyData).join('polygon')
          .attr('class','family-polytope')
          .attr('points',d=>familyPolygon(d,displayedPositions))
          .attr('fill',d=>familyColor[d.family]).attr('fill-opacity',.075)
          .attr('stroke',d=>familyColor[d.family]).attr('stroke-opacity',.42);

        const link = motionLayer.append('g').selectAll('line').data(simLinks).join('line')
          .attr('class','vos-link')
          .attr('data-source',d=>d.source.id).attr('data-target',d=>d.target.id)
          .attr('aria-label',d=>`${d.source.id} connected to ${d.target.id}`)
          .attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y)
          .attr('stroke-width',d=>.5+Math.min(2.5,d.weight));
        mapLinkSelection=link;

        let activeHoverId=activeHoverTheme;
        let hoverLockUntil=0;
        let lastTouchPin=0;
        let touchStartPoint=null;
        function beginHover(event,d) {
          if (event?.pointerType==='touch'||event?.pointerType==='pen') return;
          const now=performance.now();
          if (now<hoverLockUntil&&activeHoverId!==d.id) return;
          activeHoverId=d.id;
          activeHoverTheme=d.id;
          hoverLockUntil=now+520;
          focusNode(d);
          applyHighlight(d.id);
          showPaperTooltip(event,d);
        }

        function rememberTouchStart(event) {
          const touch=event.changedTouches?.[0];
          touchStartPoint=touch?{x:touch.clientX,y:touch.clientY,moved:false}:null;
        }

        function rememberTouchMove(event) {
          const touch=event.changedTouches?.[0];
          if (!touchStartPoint||!touch) return;
          if (Math.hypot(touch.clientX-touchStartPoint.x,touch.clientY-touchStartPoint.y)>12) touchStartPoint.moved=true;
        }

        function pinFromTouch(event,d) {
          const moved=event.type==='touchend'&&touchStartPoint?.moved;
          touchStartPoint=null;
          if (moved) return;
          const now=performance.now();
          if (now-lastTouchPin<240&&currentSelection===d.id) {
            event.preventDefault?.();
            event.stopPropagation?.();
            return;
          }
          lastTouchPin=now;
          event.preventDefault?.();
          event.stopPropagation?.();
          const touch=event.changedTouches?.[0];
          const pointEvent=touch?{clientX:touch.clientX,clientY:touch.clientY,target:event.target}:event;
          pinTheme(pointEvent,d);
        }

        function pinFromPointer(event,d) {
          if (event.pointerType!=='touch'&&event.pointerType!=='pen') return;
          pinFromTouch(event,d);
        }

        function pinFromClick(event,d) {
          event.stopPropagation();
          if (performance.now()-lastTouchPin<850) return;
          pinTheme(event,d);
        }

        function pinTheme(event,d) {
          clearTimeout(tooltipHideTimer);
          if (expandedTooltipTheme&&expandedTooltipTheme!==d.id) expandedTooltipTheme='';
          activeHoverId=d.id;
          activeHoverTheme='';
          hoverLockUntil=0;
          showSelection(d.id);
          focusNode(d);
          const clickedLink=event?.target?.closest?.('a');
          if (clickedLink) {
            tooltip.classed('is-pinned',true);
            tooltip.select('.tooltip-pin-state').text('Pinned');
          } else {
            showPaperTooltip(event,d);
          }
          pinnedTooltipPosition=tooltip.style('transform');
          pinnedTooltipAnchorPosition=pinnedTooltipPosition;
        }
        pinTooltipTheme=pinTheme;

        function clearPinnedTheme() {
          clearTimeout(tooltipHideTimer);
          activeHoverId='';
          activeHoverTheme='';
          hoverLockUntil=0;
          pinnedTooltipPosition=null;
          pinnedTooltipAnchorPosition=null;
          expandedTooltipTheme='';
          showSelection('');
          focusNode(null);
          tooltip.classed('is-visible',false).classed('is-pinned',false).attr('tabindex','-1');
        }

        const ranked = simNodes.slice().sort((a,b)=>b.weight-a.weight);
        ranked.forEach((d,i)=>{
          d.rank=i;
          d.motionSpeed=d.orbitSpeed*.35;
          d.motionAmpX=3*((width<520?8:12)+(i%3)*(width<520?2.2:3.2))*d.orbitAmpX;
          d.motionAmpY=3*((width<520?7:10)+((i+2)%3)*(width<520?2:3))*d.orbitAmpY;
          d.motionRadius=radius(d.weight);
          d.polyPointBuffers={
            node:Array.from({length:d.polySides},()=>[0,0]),
            depth:Array.from({length:d.polySides},()=>[0,0]),
            highlight:Array.from({length:d.polySides},()=>[0,0])
          };
        });
        const polygonLine=d3.line().curve(d3.curveLinearClosed);
        function nodePolygonPath(d,time=0,buffer='node') {
          const base=d.motionRadius;
          const points=d.polyPointBuffers[buffer];
          for (let i=0;i<d.polySides;i+=1) {
            const angle=-Math.PI/2+i*2*Math.PI/d.polySides+d.polyPhase*.08+.025*Math.sin(time*.55+d.polyPhase+i*1.4);
            const pulse=1+.055*Math.sin(time*.9+d.polyPhase+i*1.73);
            const r=base*d.polyFactors[i]*pulse;
            points[i][0]=Math.cos(angle)*r;
            points[i][1]=Math.sin(angle)*r;
          }
          return polygonLine(points);
        }
        const nodeWrap = motionLayer.append('g').selectAll('g').data(simNodes).join('g')
          .attr('class','vos-node-wrap')
          .attr('transform',d=>`translate(${d.x},${d.y})`);
        mapNodeWrapSelection=nodeWrap;
        const nodeFloat = nodeWrap.append('g').attr('class','node-float');
        nodeFloat.append('circle')
          .attr('class','node-hit-target')
          .attr('r',d=>radius(d.weight)+(width<520?10:13))
          .attr('aria-hidden','true')
          .on('pointerenter',beginHover)
          .on('pointermove',positionTooltip)
          .on('pointerup.touch-pin',pinFromPointer)
          .on('touchstart.touch-pin',rememberTouchStart)
          .on('touchmove.touch-pin',rememberTouchMove)
          .on('touchend.touch-pin',pinFromTouch)
          .on('click',pinFromClick);
        const nodeDepth = nodeFloat.append('path')
          .attr('class','node-depth').attr('d',d=>nodePolygonPath(d,0,'depth'))
          .attr('transform','translate(4,5)')
          .attr('fill',d=>d.blendColor);
        const node = nodeFloat.append('path')
          .attr('class','vos-node').attr('d',d=>nodePolygonPath(d))
          .attr('data-polytope-sides',d=>d.polySides)
          .attr('fill',d=>d.blendColor).attr('fill-opacity',.72)
          .attr('role','button').attr('tabindex',0)
          .attr('aria-pressed',d=>String(d.id===currentSelection))
          .attr('aria-label',d=>`${d.id}, connected to ${d.paperIds.length} papers`)
          .on('pointerenter',beginHover)
          .on('pointermove',positionTooltip)
          .on('focus',beginHover)
          .on('pointerup.touch-pin',pinFromPointer)
          .on('touchstart.touch-pin',rememberTouchStart)
          .on('touchmove.touch-pin',rememberTouchMove)
          .on('touchend.touch-pin',pinFromTouch)
          .on('click',pinFromClick)
          .on('keydown',(event,d)=>{
            if (event.key!=='Enter'&&event.key!==' ') return;
            event.preventDefault();
            event.stopPropagation();
            pinTheme(event,d);
          });
        mapNodeSelection=node;
        const nodeHighlight = nodeFloat.append('path')
          .attr('class','node-highlight').attr('d',d=>nodePolygonPath(d,0,'highlight'))
          .attr('transform','translate(-1.5,-1.5) scale(.76)');
        if (!reduceMotion) {
          let lastFrameTime=0;
          let lastShapeFrame=-Infinity;
          let lastNetworkFrame=-Infinity;
          let lastLabelFrame=-Infinity;
          let lastStarFrame=-Infinity;
          let lastKeywordFrame=-Infinity;
          let mapVisible=true;
          const networkInterval=width<520?50:32;

          const animateShapes=time=>{
            shapeAnimationFrame=0;
            if (!mapVisible||document.hidden) return;
            const delta=lastFrameTime?Math.min(50,time-lastFrameTime):16.7;
            lastFrameTime=time;
            const seconds=time/1000;
            const focusBlend=1-Math.exp(-delta/140);

            simNodes.forEach(d=>{
              d.currentBaseX+=(d.targetBaseX-d.currentBaseX)*focusBlend;
              d.currentBaseY+=(d.targetBaseY-d.currentBaseY)*focusBlend;
              d.currentScale+=(d.targetScale-d.currentScale)*focusBlend;
              if (Number.isFinite(d.targetLabelX)) {
                d.currentLabelX+=(d.targetLabelX-d.currentLabelX)*focusBlend;
                d.currentLabelY+=(d.targetLabelY-d.currentLabelY)*focusBlend;
              }
            });
            nodeWrap.attr('transform',d=>`translate(${d.currentBaseX},${d.currentBaseY}) scale(${d.currentScale})`);
            nodeFloat.attr('transform',d=>{
              const speed=d.motionSpeed;
              const orbitStrength=d.id===activeHoverId ? .22 : 1;
              const secondary=d.orbitSecondary;
              const rawX=orbitStrength*d.motionAmpX*((1-secondary)*Math.sin(seconds*speed+d.polyPhase)+secondary*Math.sin(seconds*speed*.41+d.polyPhase*2.1));
              const rawY=orbitStrength*d.motionAmpY*((1-secondary)*Math.cos(seconds*speed*.81+d.polyPhase*1.31)+secondary*Math.sin(seconds*speed*.37+d.polyPhase*.63));
              const margin=d.motionRadius*(d.id===activeHoverId?1.5:1)+8;
              const minX=(margin-d.currentBaseX)/d.currentScale;
              const maxX=(width-margin-d.currentBaseX)/d.currentScale;
              const minY=(margin-d.currentBaseY)/d.currentScale;
              const maxY=(height-margin-d.currentBaseY)/d.currentScale;
              const dx=Math.max(minX,Math.min(maxX,rawX));
              const dy=Math.max(minY,Math.min(maxY,rawY));
              const tilt=8*Math.sin(seconds*(speed*.78)+d.polyPhase*.7);
              const squash=.94+.08*(.5+.5*Math.sin(seconds*(speed*.91)+d.polyPhase));
              d.orbitX=dx;
              d.orbitY=dy;
              return `translate(${dx},${dy}) rotate(${tilt}) skewX(${tilt*.55}) scale(${squash},1)`;
            });
            labels.attr('transform',d=>`translate(${d.currentLabelX+(d.orbitX||0)*d.currentScale},${d.currentLabelY+(d.orbitY||0)*d.currentScale})`);

            if (time-lastLabelFrame>=120) {
              const animatedLabelItems=[];
              labels.each(function(d){
                if (this.style.display==='none') return;
                animatedLabelItems.push({d,el:this});
              });
              animatedLabelItems.sort((a,b)=>a.d.id===activeHoverId?-1:b.d.id===activeHoverId?1:a.d.rank-b.d.rank);
              const animatedOccupied=[];
              animatedLabelItems.forEach(({d,el})=>{
                const anchor=el.getAttribute('text-anchor')||'start';
                const x=d.currentLabelX+(d.orbitX||0)*d.currentScale;
                const y=d.currentLabelY+(d.orbitY||0)*d.currentScale;
                const textWidth=(d.labelWidth||0)*(d.id===activeHoverId?1.16:1);
                const textHeight=(d.labelHeight||d.labelFontSize)*(d.id===activeHoverId?1.16:1);
                const left=anchor==='middle'?x-textWidth/2:anchor==='end'?x-textWidth:x;
                const box={left:left-4,right:left+textWidth+4,top:y-textHeight/2-3,bottom:y+textHeight/2+3};
                const clear=animatedOccupied.every(o=>box.right<o.left||box.left>o.right||box.bottom<o.top||box.top>o.bottom);
                const keep=d.id===activeHoverId||clear;
                el.style.visibility=keep?'visible':'hidden';
                if (keep) animatedOccupied.push(box);
              });
              lastLabelFrame=time;
            }

            if (time-lastShapeFrame>=50) {
              node.attr('d',d=>nodePolygonPath(d,seconds));
              nodeDepth.attr('d',d=>nodePolygonPath(d,seconds+.18,'depth'));
              nodeHighlight.attr('d',d=>nodePolygonPath(d,seconds-.12,'highlight'));
              lastShapeFrame=time;
            }

            if (time-lastNetworkFrame>=networkInterval) {
              simNodes.forEach(d=>{
                const point=displayedPositions.get(d.id);
                point.x=d.currentBaseX+(d.orbitX||0)*d.currentScale;
                point.y=d.currentBaseY+(d.orbitY||0)*d.currentScale;
              });
              link
                .attr('x1',d=>displayedPositions.get(d.source.id).x)
                .attr('y1',d=>displayedPositions.get(d.source.id).y)
                .attr('x2',d=>displayedPositions.get(d.target.id).x)
                .attr('y2',d=>displayedPositions.get(d.target.id).y);
              hull.attr('points',d=>familyPolygon(d,displayedPositions));
              lastNetworkFrame=time;
            }

            if (time-lastStarFrame>=80) {
              stars.attr('opacity',(d,i)=>d.opacity*(.72+.28*Math.sin(seconds*(.7+(i%7)*.05)+d.phase)));
              lastStarFrame=time;
            }
            if (time-lastKeywordFrame>=66) {
              positionKeywordCloud(seconds);
              lastKeywordFrame=time;
            }
            shapeAnimationFrame=requestAnimationFrame(animateShapes);
          };

          const syncAnimationState=()=>{
            const shouldRun=mapVisible&&!document.hidden;
            root.classList.toggle('is-map-paused',!shouldRun);
            if (shouldRun&&!shapeAnimationFrame) {
              lastFrameTime=0;
              shapeAnimationFrame=requestAnimationFrame(animateShapes);
            } else if (!shouldRun&&shapeAnimationFrame) {
              cancelAnimationFrame(shapeAnimationFrame);
              shapeAnimationFrame=0;
            }
          };
          animationVisibilityHandler=syncAnimationState;
          document.addEventListener('visibilitychange',animationVisibilityHandler);
          if ('IntersectionObserver' in window) {
            animationVisibilityObserver=new IntersectionObserver(entries=>{
              mapVisible=entries[0]?.isIntersecting??true;
              syncAnimationState();
            },{rootMargin:'160px 0px'});
            animationVisibilityObserver.observe(host);
          }
          syncAnimationState();
        }

        const labelData = simNodes.slice().sort((a,b)=>a.rank-b.rank);
        const labels = motionLayer.append('g').selectAll('text').data(labelData).join('text')
          .attr('class','vos-label')
          .style('--label-size',d=>`${d.labelFontSize}px`)
          .style('fill',d=>d.blendColor);
        mapLabelSelection=labels;
        labels.each(function(d){
          const lines=d.labelLines?.length?d.labelLines:[d.id];
          const text=d3.select(this);
          lines.forEach((line,index)=>{
            text.append('tspan').attr('x',0)
              .attr('dy',index? '1.04em' : `${-(lines.length-1)*.50}em`)
              .text(line);
          });
          d.labelWidth=d3.max(Array.from(this.querySelectorAll('tspan')),span=>span.getComputedTextLength())||0;
          d.labelHeight=d.labelFontSize*Math.max(1,lines.length)*1.04;
        });
        const occupied = [];
        labels.each(function(d) {
          const r = radius(d.weight), el = d3.select(this);
          el.style('display',null);
          const candidates = [
            [d.x,d.y-r-5,'middle'], [d.x,d.y+r+14,'middle'],
            [d.x+r+6,d.y+4,'start'], [d.x-r-6,d.y+4,'end'],
            [d.x+r+5,d.y-r-3,'start'], [d.x-r-5,d.y-r-3,'end'],
            [d.x+r+5,d.y+r+12,'start'], [d.x-r-5,d.y+r+12,'end']
          ];
          let placed = false;
          for (const [x,y,anchor] of candidates) {
            el.attr('transform',`translate(${x},${y})`).attr('text-anchor',anchor).style('display',null);
            const left=anchor==='middle'?x-d.labelWidth/2:anchor==='end'?x-d.labelWidth:x;
            const box={left:left-3,right:left+d.labelWidth+3,top:y-d.labelHeight/2-3,bottom:y+d.labelHeight/2+3};
            const inside = box.left>=3 && box.right<=width-3 && box.top>=3 && box.bottom<=height-3;
            const clear = occupied.every(o=>box.right<o.left||box.left>o.right||box.bottom<o.top||box.top>o.bottom);
            if (inside && clear) {
              occupied.push(box);
              d.labelDx=x-d.x;
              d.labelDy=y-d.y;
              d.labelAnchor=anchor;
              d.currentLabelX=x;
              d.currentLabelY=y;
              d.targetLabelX=x;
              d.targetLabelY=y;
              placed=true;
              break;
            }
          }
          d.labelVisible=placed;
          if (!placed) {
            d.labelDx=0;
            d.labelDy=-r-5;
            d.labelAnchor='middle';
            d.currentLabelX=d.x;
            d.currentLabelY=d.y-r-5;
            d.targetLabelX=d.currentLabelX;
            d.targetLabelY=d.currentLabelY;
            el.style('display','none');
          }
        });
        labels
          .on('pointerenter',beginHover)
          .on('pointermove',positionTooltip)
          .on('pointerup.touch-pin',pinFromPointer)
          .on('touchstart.touch-pin',rememberTouchStart)
          .on('touchmove.touch-pin',rememberTouchMove)
          .on('touchend.touch-pin',pinFromTouch)
          .on('click',pinFromClick);

        svg.on('click.clear-selection',event=>{
          if (event.target.closest?.('.vos-node-wrap, .vos-label')) return;
          clearPinnedTheme();
        });

        function focusNode(focus) {
          const cx=width/2, cy=height/2;
          let positions=new Map(simNodes.map(d=>[d.id,{x:d.originX,y:d.originY}]));
          if (focus) {
            const angle=Math.atan2(focus.originY-cy,focus.originX-cx);
            let rotation=-Math.PI/2-angle;
            while (rotation>Math.PI) rotation-=2*Math.PI;
            while (rotation<-Math.PI) rotation+=2*Math.PI;
            rotation=Math.max(-0.30,Math.min(0.30,rotation));
            const cos=Math.cos(rotation), sin=Math.sin(rotation);
            positions=new Map(simNodes.map(d=>{
              const ox=d.originX-cx, oy=d.originY-cy;
              return [d.id,{x:cx+cos*ox-sin*oy,y:cy+sin*ox+cos*oy}];
            }));
            const focused=positions.get(focus.id);
            let tx=(cx-focused.x)*0.68, ty=(cy-focused.y)*0.68;
            const px=[...positions.values()].map(p=>p.x), py=[...positions.values()].map(p=>p.y);
            tx=Math.max(28-d3.min(px),Math.min(width-28-d3.max(px),tx));
            ty=Math.max(28-d3.min(py),Math.min(height-28-d3.max(py),ty));
            positions.forEach(p=>{p.x+=tx;p.y+=ty;});
          }
          simNodes.forEach(d=>{
            const p=positions.get(d.id);
            d.targetBaseX=p.x;
            d.targetBaseY=p.y;
            d.targetScale=d===focus?1.45:1;
            if (reduceMotion) {
              d.currentBaseX=d.targetBaseX;
              d.currentBaseY=d.targetBaseY;
              d.currentScale=d.targetScale;
            }
          });
          if (reduceMotion) {
            nodeWrap.attr('transform',d=>`translate(${d.currentBaseX},${d.currentBaseY}) scale(${d.currentScale})`);
            hull.attr('points',d=>familyPolygon(d,positions));
            link.attr('x1',d=>positions.get(d.source.id).x)
              .attr('y1',d=>positions.get(d.source.id).y)
              .attr('x2',d=>positions.get(d.target.id).x)
              .attr('y2',d=>positions.get(d.target.id).y);
          }
          labels.interrupt().classed('is-hovered',d=>d===focus).style('display',null);
          const labelTargets=new Map();
          const visibleLabels=new Set();
          const occupiedLabels=[];
          const labelElements=new Map();
          labels.each(function(d){labelElements.set(d.id,this);});
          labelData.slice().sort((a,b)=>a===focus?-1:b===focus?1:a.rank-b.rank).forEach(d=>{
            if (d!==focus&&!d.labelVisible) return;
            const p=positions.get(d.id), el=labelElements.get(d.id);
            let x=p.x+d.labelDx, y=p.y+d.labelDy, anchor=d.labelAnchor;
            const textWidth=(d.labelWidth||0)*(d===focus?1.16:1);
            const textHeight=(d.labelHeight||d.labelFontSize)*(d===focus?1.16:1);
            if (d===focus) {
              x=Math.max(textWidth/2+4,Math.min(width-textWidth/2-4,p.x));
              y=Math.max(textHeight/2+4,p.y-radius(d.weight)*1.45-8-textHeight/2);
              anchor='middle';
            }
            const left=anchor==='middle'?x-textWidth/2:anchor==='end'?x-textWidth:x;
            const box={left:left-3,right:left+textWidth+3,top:y-textHeight/2-3,bottom:y+textHeight/2+3};
            const inside=box.left>=2&&box.right<=width-2&&box.top>=2&&box.bottom<=height-2;
            const clear=occupiedLabels.every(o=>box.right<o.left||box.left>o.right||box.bottom<o.top||box.top>o.bottom);
            if (d===focus||(inside&&clear)) {
              visibleLabels.add(d.id);
              occupiedLabels.push(box);
              labelTargets.set(d.id,{x,y,anchor});
            }
          });
          labels.style('display',d=>visibleLabels.has(d.id)?null:'none')
            .attr('text-anchor',d=>(labelTargets.get(d.id)||{anchor:d.labelAnchor}).anchor)
            .each(function(d){
              const target=labelTargets.get(d.id)||{x:positions.get(d.id).x,y:positions.get(d.id).y};
              d.targetLabelX=target.x;
              d.targetLabelY=target.y;
              if (reduceMotion) {
                d.currentLabelX=target.x;
                d.currentLabelY=target.y;
                d3.select(this).attr('transform',`translate(${target.x},${target.y})`);
              }
            });
        }

        function restoreMap() {
          const selectedNode=simNodes.find(d=>d.id===currentSelection);
          activeHoverId=selectedNode?.id||'';
          activeHoverTheme='';
          hoverLockUntil=0;
          focusNode(selectedNode||null);
          applyHighlight(currentSelection);
          if (selectedNode) {
            showPaperTooltip(null,selectedNode,true);
          } else {
            tooltip.classed('is-visible',false).classed('is-pinned',false).attr('tabindex','-1').attr('data-theme',null);
          }
        }
        d3.select(host.parentElement).on('pointerleave.map',()=>{
          clearTimeout(tooltipHideTimer);
          tooltipHideTimer=setTimeout(restoreMap,180);
        });
        tooltip
          .on('pointerenter',()=>clearTimeout(tooltipHideTimer))
          .on('click.pin',event=>{
            const activeNode=simNodes.find(d=>d.id===activeHoverId);
            if (!activeNode) return;
            event.stopPropagation();
            pinTheme(event,activeNode);
          })
          .on('keydown.pin',event=>{
            if (event.key!=='Enter'&&event.key!==' ') return;
            const activeNode=simNodes.find(d=>d.id===activeHoverId);
            if (!activeNode) return;
            event.preventDefault();
            pinTheme(event,activeNode);
          });
        showSelection(currentSelection);
        if (activeHoverTheme||currentSelection) {
          const activeNode=simNodes.find(d=>d.id===(activeHoverTheme||currentSelection));
          if (activeNode) {
            activeHoverId=activeNode.id;
            focusNode(activeNode);
            applyHighlight(activeNode.id);
          }
        }
      }

      select.addEventListener('change', event => showSelection(event.target.value));
      window.addEventListener('scroll',scheduleTooltipViewportFit,{passive:true});
      window.visualViewport?.addEventListener('resize',scheduleTooltipViewportFit,{passive:true});
      window.visualViewport?.addEventListener('scroll',scheduleTooltipViewportFit,{passive:true});
      renderMap();
      showSelection('');
      const mapHost=document.getElementById('vos-keyword-map');
      const scheduleResizeRender=nextWidth=>{
        if (Math.abs(nextWidth-lastRenderedWidth)<2) return;
        clearTimeout(resizeRenderTimer);
        resizeRenderTimer=setTimeout(()=>{
          const settledWidth=Math.round(mapHost.getBoundingClientRect().width);
          if (Math.abs(settledWidth-lastRenderedWidth)>=2) renderMap();
        },140);
      };
      if ('ResizeObserver' in window) {
        new ResizeObserver(entries=>{
          const nextWidth=Math.round(entries[0]?.contentRect.width||mapHost.getBoundingClientRect().width);
          scheduleResizeRender(nextWidth);
        }).observe(mapHost);
      } else {
        window.addEventListener('resize',()=>scheduleResizeRender(Math.round(mapHost.getBoundingClientRect().width)),{passive:true});
      }
      };

      let mapStarted=false;
      const startResearchThemeMap=()=>{
        if (mapStarted) return;
        mapStarted=true;
        if (window.d3) {
          initializeResearchThemeMap();
          return;
        }
        const d3Script=document.createElement('script');
        d3Script.src='https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js';
        d3Script.async=true;
        d3Script.onload=initializeResearchThemeMap;
        d3Script.onerror=()=>{
          const status=document.getElementById('vos-selection');
          if (status) status.innerHTML='<strong>The research map could not load.</strong> Please refresh to try again.';
        };
        document.head.appendChild(d3Script);
      };

      if ('IntersectionObserver' in window) {
        const startupObserver=new IntersectionObserver(entries=>{
          if (!entries.some(entry=>entry.isIntersecting)) return;
          startupObserver.disconnect();
          startResearchThemeMap();
        },{rootMargin:'420px 0px'});
        startupObserver.observe(root);
      } else {
        startResearchThemeMap();
      }
    })();
  </script>
</div>
